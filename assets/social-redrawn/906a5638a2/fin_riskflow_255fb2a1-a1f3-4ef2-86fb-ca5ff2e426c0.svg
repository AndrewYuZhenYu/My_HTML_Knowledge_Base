<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1022" viewBox="0 0 1000 1022" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" data-redraw="source-geometry/site-style"><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L7 3.5 L0 7 Z" fill="#427999" /></marker></defs><rect width="100%" height="100%" fill="#ffffff" /><rect x="50" y="24" width="900" height="123" rx="14" fill="#ffffff" stroke="#318abf" stroke-width="2.5" /><text x="500.0" y="73.63" font-size="34" font-weight="650" text-anchor="middle" fill="#318abf">风险识别</text><text x="500.0" y="121.41000000000001" font-size="28" font-weight="400" text-anchor="middle" fill="#20343a">有哪些潜在风险？</text><line x1="500.0" y1="147" x2="500.0" y2="177" stroke="#427999" stroke-width="3" marker-end="url(#arrow)" /><rect x="50" y="182" width="900" height="123" rx="14" fill="#ffffff" stroke="#1da193" stroke-width="2.5" /><text x="500.0" y="231.63" font-size="34" font-weight="650" text-anchor="middle" fill="#1da193">风险计量</text><text x="500.0" y="279.40999999999997" font-size="28" font-weight="400" text-anchor="middle" fill="#20343a">风险敞口和可能损失是多少？</text><line x1="500.0" y1="305" x2="500.0" y2="335" stroke="#427999" stroke-width="3" marker-end="url(#arrow)" /><rect x="50" y="340" width="900" height="123" rx="14" fill="#ffffff" stroke="#9e7135" stroke-width="2.5" /><text x="500.0" y="389.63" font-size="34" font-weight="650" text-anchor="middle" fill="#9e7135">风险评价</text><text x="500.0" y="437.41" font-size="28" font-weight="400" text-anchor="middle" fill="#20343a">风险是否超过承受能力？</text><line x1="500.0" y1="463" x2="500.0" y2="493" stroke="#427999" stroke-width="3" marker-end="url(#arrow)" /><rect x="50" y="498" width="900" height="123" rx="14" fill="#ffffff" stroke="#67429a" stroke-width="2.5" /><text x="500.0" y="547.63" font-size="34" font-weight="650" text-anchor="middle" fill="#67429a">风险处理</text><text x="500.0" y="595.4100000000001" font-size="28" font-weight="400" text-anchor="middle" fill="#20343a">采用规避、分散、对冲等方式管理风险</text><line x1="500.0" y1="621" x2="500.0" y2="651" stroke="#427999" stroke-width="3" marker-end="url(#arrow)" /><rect x="50" y="656" width="900" height="123" rx="14" fill="#ffffff" stroke="#318abf" stroke-width="2.5" /><text x="500.0" y="705.63" font-size="34" font-weight="650" text-anchor="middle" fill="#318abf">风险监测</text><text x="500.0" y="753.4100000000001" font-size="28" font-weight="400" text-anchor="middle" fill="#20343a">持续观察风险指标和环境变化</text><line x1="500.0" y1="779" x2="500.0" y2="809" stroke="#427999" stroke-width="3" marker-end="url(#arrow)" /><rect x="50" y="814" width="900" height="123" rx="14" fill="#ffffff" stroke="#1da193" stroke-width="2.5" /><text x="500.0" y="863.63" font-size="34" font-weight="650" text-anchor="middle" fill="#1da193">风险报告与复核</text><text x="500.0" y="911.4100000000001" font-size="28" font-weight="400" text-anchor="middle" fill="#20343a">向相关管理者报告并改善风险管理制度</text><text x="500.0" y="997" font-size="28" font-weight="500" text-anchor="middle" fill="#20343a">不断反馈与更新的持续管理过程</text></svg>