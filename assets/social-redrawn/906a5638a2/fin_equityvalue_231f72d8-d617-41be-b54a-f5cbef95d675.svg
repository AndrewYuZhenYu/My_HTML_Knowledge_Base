<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="565" viewBox="0 0 1100 565" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" data-redraw="source-geometry/site-style"><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L7 3.5 L0 7 Z" fill="#427999" /></marker></defs><rect width="100%" height="100%" fill="#ffffff" /><rect x="30" y="20" width="1040" height="78" rx="14" fill="#ffffff" stroke="#318abf" stroke-width="2.5" /><text x="550.0" y="71.075" font-size="35" font-weight="650" text-anchor="middle" fill="#318abf">股票与股权估值</text><path d="M550.0 98 V115 H275.0 V140 M550.0 115 H825.0 V140" stroke="#427999" stroke-width="3" fill="none" /><rect x="25" y="140" width="505.0" height="290" rx="14" fill="#ffffff" stroke="#318abf" stroke-width="2.5" /><text x="277.5" y="214.33" font-size="34" font-weight="650" text-anchor="middle" fill="#318abf">绝对估值</text><text x="277.5" y="262.11" font-size="28" font-weight="400" text-anchor="middle" fill="#20343a">根据资产自身未来经济利益估值</text><text x="277.5" y="301.31" font-size="28" font-weight="400" text-anchor="middle" fill="#20343a">股利折现模型 DDM</text><text x="277.5" y="340.51" font-size="28" font-weight="400" text-anchor="middle" fill="#20343a">自由现金流折现 DCF</text><text x="277.5" y="379.71000000000004" font-size="28" font-weight="400" text-anchor="middle" fill="#20343a">剩余收益模型 RIM</text><rect x="570.0" y="140" width="505.0" height="290" rx="14" fill="#ffffff" stroke="#1da193" stroke-width="2.5" /><text x="822.5" y="194.73000000000002" font-size="34" font-weight="650" text-anchor="middle" fill="#1da193">相对估值</text><text x="822.5" y="242.51000000000002" font-size="28" font-weight="400" text-anchor="middle" fill="#20343a">根据可比公司或市场定价关系估值</text><text x="822.5" y="281.71000000000004" font-size="28" font-weight="400" text-anchor="middle" fill="#20343a">市盈率 P/E</text><text x="822.5" y="320.91" font-size="28" font-weight="400" text-anchor="middle" fill="#20343a">市净率 P/B</text><text x="822.5" y="360.11" font-size="28" font-weight="400" text-anchor="middle" fill="#20343a">市销率 P/S</text><text x="822.5" y="399.31" font-size="28" font-weight="400" text-anchor="middle" fill="#20343a">EV/EBITDA等倍数</text><rect x="25" y="450" width="1050" height="96" rx="14" fill="#ffffff" stroke="#67429a" stroke-width="2.5" /><text x="550.0" y="508.35" font-size="30" font-weight="650" text-anchor="middle" fill="#67429a">资产基础估值：根据资产、负债及相关调整估计企业剩余权益价值。</text></svg>