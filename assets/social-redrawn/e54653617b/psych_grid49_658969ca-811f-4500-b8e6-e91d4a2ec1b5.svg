<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="474" viewBox="0 0 1200 474" data-redraw="source-geometry/site-style"><rect x="0" y="0" width="1200" height="474" rx="0" fill="#ffffff" stroke="none" stroke-width="2" /><text x="600.0" y="49" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="34" font-weight="700" fill="#20343a" text-anchor="middle">常见动机冲突类型</text><line x1="45" y1="75" x2="1155" y2="75" stroke="#d5e1e4" stroke-width="2" /><rect x="45.0" y="103" width="543.0" height="160" rx="14" fill="#ffffff" stroke="#d5e1e4" stroke-width="2" /><rect x="47.0" y="105" width="8" height="156" rx="4" fill="#267caf" stroke="none" stroke-width="2" /><text x="316.5" y="154.5" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="30" font-weight="700" fill="#267caf" text-anchor="middle">双趋冲突</text><text x="316.5" y="196.5" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="25" font-weight="400" fill="#20343a" text-anchor="middle">两个想要的目标难以同时取得（有利A、有利</text><text x="316.5" y="230.5" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="25" font-weight="400" fill="#20343a" text-anchor="middle">B）</text><rect x="612.0" y="103" width="543.0" height="160" rx="14" fill="#ffffff" stroke="#d5e1e4" stroke-width="2" /><rect x="614.0" y="105" width="8" height="156" rx="4" fill="#9e6c2a" stroke="none" stroke-width="2" /><text x="883.5" y="154.5" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="30" font-weight="700" fill="#9e6c2a" text-anchor="middle">双避冲突</text><text x="883.5" y="196.5" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="25" font-weight="400" fill="#20343a" text-anchor="middle">必须在两个不希望的结果中选择（不利A、不</text><text x="883.5" y="230.5" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="25" font-weight="400" fill="#20343a" text-anchor="middle">利B）</text><rect x="45.0" y="287" width="543.0" height="145" rx="14" fill="#ffffff" stroke="#d5e1e4" stroke-width="2" /><rect x="47.0" y="289" width="8" height="141" rx="4" fill="#644095" stroke="none" stroke-width="2" /><text x="316.5" y="348.0" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="30" font-weight="700" fill="#644095" text-anchor="middle">趋避冲突</text><text x="316.5" y="390.0" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="25" font-weight="400" fill="#20343a" text-anchor="middle">同一个目标既有吸引力又有不利后果</text><rect x="612.0" y="287" width="543.0" height="145" rx="14" fill="#ffffff" stroke="#d5e1e4" stroke-width="2" /><rect x="614.0" y="289" width="8" height="141" rx="4" fill="#256b95" stroke="none" stroke-width="2" /><text x="883.5" y="348.0" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="30" font-weight="700" fill="#256b95" text-anchor="middle">双重趋避冲突</text><text x="883.5" y="390.0" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="25" font-weight="400" fill="#20343a" text-anchor="middle">两个选项各自具有正负属性</text></svg>