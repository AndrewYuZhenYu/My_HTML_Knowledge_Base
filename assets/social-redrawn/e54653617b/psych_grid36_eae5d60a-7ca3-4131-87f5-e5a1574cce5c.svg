<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="339" viewBox="0 0 1200 339" data-redraw="source-geometry/site-style"><rect x="0" y="0" width="1200" height="339" rx="0" fill="#ffffff" stroke="none" stroke-width="2" /><text x="600.0" y="49" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="34" font-weight="700" fill="#20343a" text-anchor="middle">双加工理论</text><line x1="45" y1="75" x2="1155" y2="75" stroke="#d5e1e4" stroke-width="2" /><rect x="45.0" y="103" width="543.0" height="194" rx="14" fill="#ffffff" stroke="#d5e1e4" stroke-width="2" /><rect x="47.0" y="105" width="8" height="190" rx="4" fill="#267caf" stroke="none" stroke-width="2" /><text x="316.5" y="154.5" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="30" font-weight="700" fill="#267caf" text-anchor="middle">系统一</text><text x="316.5" y="196.5" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="25" font-weight="400" fill="#20343a" text-anchor="middle">快速、自动化加工；依赖直觉与联想；较少</text><text x="316.5" y="230.5" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="25" font-weight="400" fill="#20343a" text-anchor="middle">消耗主动控制资源；快速识别熟悉情境；可</text><text x="316.5" y="264.5" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="25" font-weight="400" fill="#20343a" text-anchor="middle">能受到启发式与偏差影响</text><rect x="612.0" y="103" width="543.0" height="194" rx="14" fill="#ffffff" stroke="#d5e1e4" stroke-width="2" /><rect x="614.0" y="105" width="8" height="190" rx="4" fill="#9e6c2a" stroke="none" stroke-width="2" /><text x="883.5" y="154.5" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="30" font-weight="700" fill="#9e6c2a" text-anchor="middle">系统二</text><text x="883.5" y="196.5" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="25" font-weight="400" fill="#20343a" text-anchor="middle">相对缓慢、控制性加工；依赖主动注意；规</text><text x="883.5" y="230.5" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="25" font-weight="400" fill="#20343a" text-anchor="middle">则、推理与计算；复杂问题解决；仍可能发</text><text x="883.5" y="264.5" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="25" font-weight="400" fill="#20343a" text-anchor="middle">生判断错误</text></svg>