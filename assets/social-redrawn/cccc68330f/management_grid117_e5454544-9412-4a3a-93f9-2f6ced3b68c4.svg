<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="797" viewBox="0 0 1200 797" data-redraw="source-geometry/site-style"><rect x="0" y="0" width="1200" height="797" rx="0" fill="#ffffff" stroke="none" stroke-width="2" /><text x="600.0" y="49" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="34" font-weight="700" fill="#20343a" text-anchor="middle">企业诊断的主要维度</text><line x1="45" y1="75" x2="1155" y2="75" stroke="#d5e1e4" stroke-width="2" /><rect x="45.0" y="103" width="543.0" height="145" rx="14" fill="#ffffff" stroke="#d5e1e4" stroke-width="2" /><rect x="47.0" y="105" width="8" height="141" rx="4" fill="#267caf" stroke="none" stroke-width="2" /><text x="316.5" y="164.0" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="30" font-weight="700" fill="#267caf" text-anchor="middle">战略诊断</text><text x="316.5" y="206.0" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="25" font-weight="400" fill="#20343a" text-anchor="middle">发展方向及竞争方式是否合理？</text><rect x="612.0" y="103" width="543.0" height="145" rx="14" fill="#ffffff" stroke="#d5e1e4" stroke-width="2" /><rect x="614.0" y="105" width="8" height="141" rx="4" fill="#9e6c2a" stroke="none" stroke-width="2" /><text x="883.5" y="164.0" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="30" font-weight="700" fill="#9e6c2a" text-anchor="middle">市场诊断</text><text x="883.5" y="206.0" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="25" font-weight="400" fill="#20343a" text-anchor="middle">是否存在真实客户需求及有效市场？</text><rect x="45.0" y="272" width="543.0" height="145" rx="14" fill="#ffffff" stroke="#d5e1e4" stroke-width="2" /><rect x="47.0" y="274" width="8" height="141" rx="4" fill="#644095" stroke="none" stroke-width="2" /><text x="316.5" y="333.0" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="30" font-weight="700" fill="#644095" text-anchor="middle">财务诊断</text><text x="316.5" y="375.0" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="25" font-weight="400" fill="#20343a" text-anchor="middle">盈利、现金流及资本回报是否健康？</text><rect x="612.0" y="272" width="543.0" height="145" rx="14" fill="#ffffff" stroke="#d5e1e4" stroke-width="2" /><rect x="614.0" y="274" width="8" height="141" rx="4" fill="#256b95" stroke="none" stroke-width="2" /><text x="883.5" y="333.0" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="30" font-weight="700" fill="#256b95" text-anchor="middle">运营诊断</text><text x="883.5" y="375.0" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="25" font-weight="400" fill="#20343a" text-anchor="middle">成本、质量、速度及交付存在哪些问题？</text><rect x="45.0" y="441" width="543.0" height="145" rx="14" fill="#ffffff" stroke="#d5e1e4" stroke-width="2" /><rect x="47.0" y="443" width="8" height="141" rx="4" fill="#5f737b" stroke="none" stroke-width="2" /><text x="316.5" y="502.0" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="30" font-weight="700" fill="#5f737b" text-anchor="middle">组织诊断</text><text x="316.5" y="544.0" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="25" font-weight="400" fill="#20343a" text-anchor="middle">结构、权责及协作机制是否合理？</text><rect x="612.0" y="441" width="543.0" height="145" rx="14" fill="#ffffff" stroke="#d5e1e4" stroke-width="2" /><rect x="614.0" y="443" width="8" height="141" rx="4" fill="#267caf" stroke="none" stroke-width="2" /><text x="883.5" y="502.0" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="30" font-weight="700" fill="#267caf" text-anchor="middle">人才诊断</text><text x="883.5" y="544.0" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="25" font-weight="400" fill="#20343a" text-anchor="middle">人员能力、激励及配置是否支持经营？</text><rect x="45.0" y="610" width="543.0" height="145" rx="14" fill="#ffffff" stroke="#d5e1e4" stroke-width="2" /><rect x="47.0" y="612" width="8" height="141" rx=