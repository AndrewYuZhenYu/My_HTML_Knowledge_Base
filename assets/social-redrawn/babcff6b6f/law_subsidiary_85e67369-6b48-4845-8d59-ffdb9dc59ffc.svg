" stroke-width="2" /><text x="316.5" y="311.5" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="30" font-weight="700" fill="#9e6c2a" text-anchor="middle">子公司</text><text x="316.5" y="353.5" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="25" font-weight="400" fill="#20343a" text-anchor="middle">独立法人B；通常独立承担债务</text><rect x="612.0" y="266" width="543.0" height="114" rx="14" fill="#ffffff" stroke="#d5e1e4" stroke-width="2" /><rect x="614.0" y="268" width="8" height="110" rx="4" fill="#644095" stroke="none" stroke-width="2" /><text x="883.5" y="311.5" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="30" font-weight="700" fill="#644095" text-anchor="middle">分公司</text><text x="883.5" y="353.5" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="25" font-weight="400" fill="#20343a" text-anchor="middle">法人A的分支；责任通常归于总公司</text><text x="600" y="438.0" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="23" font-weight="400" fill="#5f737b" text-anchor="middle">前者是股权控制等关系，后者是内部组织关系。</text></svg>