<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="628" viewBox="0 0 1200 628" data-redraw="source-geometry/site-style"><rect x="0" y="0" width="1200" height="628" rx="0" fill="#ffffff" stroke="none" stroke-width="2" /><text x="600.0" y="49" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="34" font-weight="700" fill="#20343a" text-anchor="middle">税收的法律结构</text><line x1="45" y1="75" x2="1155" y2="75" stroke="#d5e1e4" stroke-width="2" /><rect x="45.0" y="103" width="543.0" height="145" rx="14" fill="#ffffff" stroke="#d5e1e4" stroke-width="2" /><rect x="47.0" y="105" width="8" height="141" rx="4" fill="#267caf" stroke="none" stroke-width="2" /><text x="316.5" y="164.0" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="30" font-weight="700" fill="#267caf" text-anchor="middle">纳税主体</text><text x="316.5" y="206.0" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="25" font-weight="400" fill="#20343a" text-anchor="middle">谁承担相应纳税义务？</text><rect x="612.0" y="103" width="543.0" height="145" rx="14" fill="#ffffff" stroke="#d5e1e4" stroke-width="2" /><rect x="614.0" y="105" width="8" height="141" rx="4" fill="#9e6c2a" stroke="none" stroke-width="2" /><text x="883.5" y="164.0" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="30" font-weight="700" fill="#9e6c2a" text-anchor="middle">征税对象</text><text x="883.5" y="206.0" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="25" font-weight="400" fill="#20343a" text-anchor="middle">对什么收入、财产或经济活动征税？</text><rect x="45.0" y="272" width="543.0" height="145" rx="14" fill="#ffffff" stroke="#d5e1e4" stroke-width="2" /><rect x="47.0" y="274" width="8" height="141" rx="4" fill="#644095" stroke="none" stroke-width="2" /><text x="316.5" y="333.0" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="30" font-weight="700" fill="#644095" text-anchor="middle">计税依据</text><text x="316.5" y="375.0" font-