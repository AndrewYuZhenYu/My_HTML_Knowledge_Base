<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1076" viewBox="0 0 1000 1076" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" data-redraw="source-geometry/site-style"><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L7 3.5 L0 7 Z" fill="#427999" /></marker></defs><rect width="100%" height="100%" fill="#ffffff" /><text x="500.0" y="49" font-size="36" font-weight="650" text-anchor="middle" fill="#20343a">信用扩张与经济下行的反馈链条</text><rect x="50" y="78" width="900" height="123" rx="14" fill="#ffffff" stroke="#318abf" stroke-width="2.5" /><text x="500.0" y="127.63" font-size="34" font-weight="650" text-anchor="middle" fill="#318abf">经济繁荣与信用扩张</text><text x="500.0" y="181.53" font-size="28" font-weight="400" text-anchor="middle" fill="#20343a">债务与资产价格可能持续上升</text><line x1="500.0" y1="201" x2="500.0" y2="231" stroke="#427999" stroke-width="3" marker-end="url(#arrow)" /><rect x="50" y="236" width="900" height="123" rx="14" fill="#ffffff" stroke="#1da193" stroke-width="2.5" /><text x="500.0" y="285.63" font-size="34" font-weight="650" text-anchor="middle" fill="#1da193">预期逆转或外部冲击</text><text x="500.0" y="339.53" font-size="28" font-weight="400" text-anchor="middle" fill="#20343a">资产价格下跌、抵押品价值减少</text><line x1="500.0" y1="359" x2="500.0" y2="389" stroke="#427999" stroke-width="3" marker-end="url(#arrow)" /><rect x="50" y="394" width="900" height="123" rx="14" fill="#ffffff" stroke="#9e7135" stroke-width="2.5" /><text x="500.0" y="443.63" font-size="34" font-weight="650" text-anchor="middle" fill="#9e7135">资产负债表恶化</text><text x="500.0" y="497.53" font-size="28" font-weight="400" text-anchor="middle" fill="#20343a">债务压力及金融风险上升</text><line x1="500.0" y1="517" x2="500.0" y2="547" stroke="#427999" stroke-width="3" marker-end="url(#arrow)" /><rect x="50" y="552" width="900" height="123" rx="14" fill="#ffffff" stroke="#67429a" stroke-width="2.5" /><text x="500.0" y="601.63" font-size="34" font-weight="650" text-anchor="middle" fill="#67429a">信用紧缩与去杠杆</text><text x="500.0" y="655.53" font-size="28" font-weight="400" text-anchor="middle" fill="#20343a">贷款条件收紧，居民企业减少支出</text><line x1="500.0" y1="675" x2="500.0" y2="705" stroke="#427999" stroke-width="3" marker-end="url(#arrow)" /><rect x="50" y="710" width="900" height="123" rx="14" fill="#ffffff" stroke="#318abf" stroke-width="2.5" /><text x="500.0" y="759.63" font-size="34" font-weight="650" text-anchor="middle" fill="#318abf">总需求与经济产出下降</text><text x="500.0" y="813.53" font-size="28" font-weight="400" text-anchor="middle" fill="#20343a">企业收入下降，失业增加</text><line x1="500.0" y1="833" x2="500.0" y2="863" stroke="#427999" stroke-width="3" marker-end="url(#arrow)" /><rect x="50" y="868" width="900" height="123" rx="14" fill="#ffffff" stroke="#1da193" stroke-width="2.5" /><text x="500.0" y="917.63" font-size="34" font-weight="650" text-anchor="middle" fill="#1da193">经济状况进一步恶化</text><text x="500.0" y="971.53" font-size="28" font-weight="400" text-anchor="middle" fill="#20343a">进一步增加违约风险和资产价格压力</text><text x="500.0" y="1051" font-size="28" font-weight="500" text-anchor="middle" fill="#20343a">可能形成不断强化的下行反馈</text></svg>