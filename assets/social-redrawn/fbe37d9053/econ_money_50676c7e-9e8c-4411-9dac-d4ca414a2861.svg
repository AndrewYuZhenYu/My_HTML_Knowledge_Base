<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="540" viewBox="0 0 1000 540" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" data-redraw="source-geometry/site-style"><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L7 3.5 L0 7 Z" fill="#427999" /></marker></defs><rect width="100%" height="100%" fill="#ffffff" /><rect x="30" y="25" width="940" height="490" rx="20" fill="#ffffff" stroke="#427999" stroke-width="3" /><text x="65" y="76" font-size="36" font-weight="650" text-anchor="start" fill="#20343a">M2　广义货币</text><text x="65" y="120" font-size="29" font-weight="400" text-anchor="start" fill="#20343a">包含M1及部分流动性较低的货币资产</text><rect x="85" y="150" width="830" height="335" rx="18" fill="#ffffff" stroke="#318abf" stroke-width="3" /><text x="120" y="200" font-size="34" font-weight="650" text-anchor="start" fill="#318abf">M1　狭义货币</text><text x="120" y="245" font-size="29" font-weight="400" text-anchor="start" fill="#20343a">通常包含现金及可直接用于支付的相关存款</text><rect x="150" y="280" width="700" height="160" rx="16" fill="#ffffff" stroke="#427999" stroke-width="2" /><text x="185" y="336" font-size="34" font-weight="650" text-anchor="start" fill="#20343a">M0　流通中的现金</text><text x="185" y="390" font-size="29" font-weight="400" text-anchor="start" fill="#20343a">通常是社会公众持有的纸币与硬币</text></svg>