<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" data-redraw="source-geometry/site-style"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8" fill="#417899" /></marker></defs><rect width="1200" height="600" fill="#ffffff" /><text x="600" y="44.0" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="32" fill="#20343a" text-anchor="middle" dominant-baseline="central" font-weight="700"><tspan x="600" dy="0">政治精英产生与流动</tspan></text><rect x="80.0" y="85.0" width="1040" height="70" rx="12" fill="#d5e1e4" stroke="#3082b3" stroke-width="2" /><text x="600" y="120.0" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="22" fill="#20343a" text-anchor="middle" dominant-baseline="central" font-weight="400"><tspan x="600" dy="0">人才来源：社会组织、公共机构、专业领域</tspan></text><path d="M600 155 L600 185" stroke="#417899" stroke-width="2.5" fill="none" marker-end="url(#arrow)" /><rect x="80.0" y="185.0" width="1040" height="70" rx="12" fill="#d5e1e4" stroke="#a07235" stroke-width="2" /><text x="600" y="220.0" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="22" fill="#20343a" text-anchor="middle" dominant-baseline="central" font-weight="400"><tspan x="600" dy="0">选拔培养：选举、任命、组织晋升</tspan></text><path d="M600 255 L600 285" stroke="#417899" stroke-width="2.5" fill="none" marker-end="url(#arrow)" /><rect x="80.0" y="285.0" width="1040" height="70" rx="12" fill="#d5e1e4" stroke="#654096" stroke-width="2" /><text x="600" y="320.0" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="22" fill="#20343a" text-anchor="middle" dominant-baseline="central" font-weight="400"><tspan x="600" dy="0">获得职位：权限或组织角色</tspan></text><path d="M600 355 L600 385" stroke="#417899" stroke-width="2.5" fill="none" marker-end="url(#arrow)" /><rect x="80.0" y="385.0" width="1040" height="70" rx="12" fill="#d5e1e4" stroke="#26968a" stroke-width="2" /><text x="600" y="420.0" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="22" fill="#20343a" text-anchor="middle" dominant-baseline="central" font-weight="400"><tspan x="600" dy="0">政治活动与责任：履职、决策、监督</tspan></text><path d="M600 455 L600 485" stroke="#417899" stroke-width="2.5" fill="none" marker-end="url(#arrow)" /><rect x="80.0" y="485.0" width="1040" height="70" rx="12" fill="#d5e1e4" stroke="#3e7190" stroke-width="2" /><text x="600" y="520.0" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="22" fill="#20343a" text-anchor="middle" dominant-baseline="central" font-weight="400"><tspan x="600" dy="0">退出及更替：任期结束、调整、退休</tspan></text></svg>