<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" data-redraw="source-geometry/site-style"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8" fill="#417899" /></marker></defs><rect width="1200" height="630" fill="#ffffff" /><text x="600" y="44.0" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="32" fill="#20343a" text-anchor="middle" dominant-baseline="central" font-weight="700"><tspan x="600" dy="0">中国政治制度基本组织框架</tspan></text><rect x="125.0" y="87.5" width="950" height="65" rx="12" fill="#d5e1e4" stroke="#3082b3" stroke-width="2" /><text x="600" y="120.0" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="26" fill="#20343a" text-anchor="middle" dominant-baseline="central" font-weight="400"><tspan x="600" dy="0">中国共产党领导：重要宪制及政治基础</tspan></text><rect x="125.0" y="180.0" width="950" height="90" rx="12" fill="#d5e1e4" stroke="#3082b3" stroke-width="2" /><text x="600" y="210.12" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="24" fill="#20343a" text-anchor="middle" dominant-baseline="central" font-weight="400"><tspan x="600" dy="0">全国人民代表大会及其常务委员会</tspan><tspan x="600" dy="29.759999999999998">最高国家权力机关及其常设机关</tspan></text><text x="600" y="300.0" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="21" fill="#20343a" text-anchor="middle" dominant-baseline="central" font-weight="400"><tspan x="600" dy="0">国家机关的产生、负责及监督等制度关系</tspan></text><path d="M600 330 L150 385" stroke="#417899" stroke-width="2.5" fill="none" marker-end="url(#arrow)" /><rect x="13.0" y="385.0" width="274" height="90" rx="12" fill="#d5e1e4" stroke="#3082b3" stroke-width="2" /><text x="150" y="416.98" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="21" fill="#20343a" text-anchor="middle" dominant-baseline="central" font-weight="400"><tspan x="150" dy="0">国务院</tspan><tspan x="150" dy="26.04">最高国家行政机关</tspan></text><path d="M600 330 L450 385" stroke="#417899" stroke-width="2.5" fill="none" marker-end="url(#arrow)" /><rect x="313.0" y="385.0" width="274" height="90" rx="12" fill="#d5e1e4" stroke="#a07235" stroke-width="2" /><text x="450" y="416.98" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="21" fill="#20343a" text-anchor="middle" dominant-baseline="central" font-weight="400"><tspan x="450" dy="0">国家监察委员会</tspan><tspan x="450" dy="26.04">最高监察机关</tspan></text><path d="M600 330 L750 385" stroke="#417899" stroke-width="2.5" fill="none" marker-end="url(#arrow)" /><rect x="613.0" y="385.0" width="274" height="90" rx="12" fill="#d5e1e4" stroke="#654096" stroke-width="2" /><text x="750" y="416.98" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="21" fill="#20343a" text-anchor="middle" dominant-baseline="central" font-weight="400"><tspan x="750" dy="0">最高人民法院</tspan><tspan x="750" dy="26.04">最高审判机关</tspan></text><path d="M600 330 L1050 385" stroke="#417899" stroke-width="2.5" fill="none" marker-end="url(#arrow)" /><rect x="913.0" y="385.0" width="274" height="90" rx="12" fill="#d5e1e4" stroke="#26968a" stroke-width="2" /><text x="1050" y="416.98" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="21" fill="#20343a" text-anchor="middle" dominant-baseline="central" font-weight="400"><tspan x="1050" dy="0">最高人民检察院</tspan><tspan x="1050" dy="26.04">最高检察机关</tspan></text><rect x="35.0" y="502.5" width="1130" height="95" rx="12" fill="#d5e1e4" stroke="#3e7190" stroke-width="2" /><text x="600" y="537.6" font-family="Inter, PingFang SC, Noto Sans CJK SC, sans-serif" font-size="20" fill="#20343a" text-anchor="middle" dominant-baseline="central" font-weight="400"><tspan x="600" dy="0">其他重要机构与制度：国家主席、中央军事委员会、地方各级国家机关、政协</tspan><tspan x="600" dy="24.8">政协是政治协商机构，并非国家权力机关</tspan></text></svg>