<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="847" viewBox="0 0 1200 847"><rect x="0" y="0" width="1200" height="847" rx="0" fill="#ffffff" stroke="none" stroke-width="2"/><text x="600.0" y="49" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="34" font-weight="700" fill="#203047" text-anchor="middle">知识产权及相关保护制度</text><line x1="45" y1="75" x2="1155" y2="75" stroke="#d4dee9" stroke-width="2" /><line x1="68" y1="151.0" x2="68" y2="751.0" stroke="#2563a6" stroke-width="4" /><line x1="68" y1="151.0" x2="103" y2="151.0" stroke="#2563a6" stroke-width="3" /><circle cx="68" cy="151.0" r="5" fill="#2563a6" stroke="none" stroke-width="2" opacity="1"/><rect x="103" y="100" width="1052" height="102" rx="14" fill="#f5f8fc" stroke="#d4dee9" stroke-width="2"/><rect x="105" y="102" width="8" height="98" rx="4" fill="#2563a6" stroke="none" stroke-width="2"/><text x="629.0" y="139.5" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="30" font-weight="700" fill="#2563a6" text-anchor="middle">著作权 Copyright</text><text x="629.0" y="181.5" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="25" font-weight="400" fill="#203047" text-anchor="middle">保护作品的原创表达，如文章、音乐、软件代码、美术作品</text><line x1="68" y1="271.0" x2="103" y2="271.0" stroke="#2563a6" stroke-width="3" /><circle cx="68" cy="271.0" r="5" fill="#2563a6" stroke="none" stroke-width="2" opacity="1"/><rect x="103" y="220" width="1052" height="102" rx="14" fill="#f5f8fc" stroke="#d4dee9" stroke-width="2"/><rect x="105" y="222" width="8" height="98" rx="4" fill="#94702c" stroke="none" stroke-width="2"/><text x="629.0" y="259.5" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="30" font-weight="700" fill="#94702c" text-anchor="middle">专利权 Patent</text><text x="629.0" y="301.5" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="25" font-weight="400" fill="#203047" text-anchor="middle">保护符合相应条件并取得授权的技术成果，如发明、实用技术及相关专利类型</text><line x1="68" y1="391.0" x2="103" y2="391.0" stroke="#2563a6" stroke-width="3" /><circle cx="68" cy="391.0" r="5" fill="#2563a6" stroke="none" stroke-width="2" opacity="1"/><rect x="103" y="340" width="1052" height="102" rx="14" fill="#f5f8fc" stroke="#d4dee9" stroke-width="2"/><rect x="105" y="342" width="8" height="98" rx="4" fill="#7960a6" stroke="none" stroke-width="2"/><text x="629.0" y="379.5" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="30" font-weight="700" fill="#7960a6" text-anchor="middle">商标权 Trademark</text><text x="629.0" y="421.5" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="25" font-weight="400" fill="#203047" text-anchor="middle">保护识别商品或服务来源的标志，如品牌名称、标志等</text><line x1="68" y1="511.0" x2="103" y2="511.0" stroke="#2563a6" stroke-width="3" /><circle cx="68" cy="511.0" r="5" fill="#2563a6" stroke="none" stroke-width="2" opacity="1"/><rect x="103" y="460" width="1052" height="102" rx="14" fill="#f5f8fc" stroke="#d4dee9" stroke-width="2"/><rect x="105" y="462" width="8" height="98" rx="4" fill="#247e82" stroke="none" stroke-width="2"/><text x="629.0" y="499.5" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="30" font-weight="700" fill="#247e82" text-anchor="middle">工业品外观设计</text><text x="629.0" y="541.5" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="25" font-weight="400" fill="#203047" text-anchor="middle">保护符合条件的产品外观设计，如形状、图案、装饰性设计</text><line x1="68" y1="631.0" x2="103" y2="631.0" stroke="#2563a6" stroke-width="3" /><circle cx="68" cy="631.0" r="5" fill="#2563a6" stroke="none" stroke-width="2" opacity="1"/><rect x="103" y="580" width="1052" height="102" rx="14" fill="#f5f8fc" stroke="#d4dee9" stroke-width="2"/><rect x="105" y="582" width="8" height="98" rx="4" fill="#64748b" stroke="none" stroke-width="2"/><text x="629.0" y="619.5" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="30" font-weight="700" fill="#64748b" text-anchor="middle">商业秘密 Trade Secret</text><text x="629.0" y="661.5" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="25" font-weight="400" fill="#203047" text-anchor="middle">保护符合相应条件的非公开商业信息，如工艺、算法、商业策略等</text><line x1="68" y1="751.0" x2="103" y2="751.0" stroke="#2563a6" stroke-width="3" /><circle cx="68" cy="751.0" r="5" fill="#2563a6" stroke="none" stroke-width="2" opacity="1"/><rect x="103" y="700" width="1052" height="102" rx="14" fill="#f5f8fc" stroke="#d4dee9" stroke-width="2"/><rect x="105" y="702" width="8" height="98" rx="4" fill="#2563a6" stroke="none" stroke-width="2"/><text x="629.0" y="739.5" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="30" font-weight="700" fill="#2563a6" text-anchor="middle">其他知识产权制度</text><text x="629.0" y="781.5" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="25" font-weight="400" fill="#203047" text-anchor="middle">保护具有特定性质的知识及商业标识，如地理标志、植物新品种等</text></svg>