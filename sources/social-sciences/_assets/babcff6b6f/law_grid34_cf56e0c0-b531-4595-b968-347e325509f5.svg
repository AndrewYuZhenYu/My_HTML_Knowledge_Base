<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="643" viewBox="0 0 1200 643"><rect x="0" y="0" width="1200" height="643" rx="0" fill="#ffffff" stroke="none" stroke-width="2"/><text x="600.0" y="49" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="34" font-weight="700" fill="#203047" text-anchor="middle">一般过错侵权的分析结构</text><line x1="45" y1="75" x2="1155" y2="75" stroke="#d4dee9" stroke-width="2" /><rect x="45.0" y="103" width="543.0" height="160" rx="14" fill="#f5f8fc" stroke="#d4dee9" stroke-width="2"/><rect x="47.0" y="105" width="8" height="156" rx="4" fill="#2563a6" stroke="none" stroke-width="2"/><text x="316.5" y="154.5" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="30" font-weight="700" fill="#2563a6" text-anchor="middle">行为或不作为</text><text x="316.5" y="196.5" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="25" font-weight="400" fill="#203047" text-anchor="middle">行为人实施了什么行为，或者未履行何种义</text><text x="316.5" y="230.5" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="25" font-weight="400" fill="#203047" text-anchor="middle">务？</text><rect x="612.0" y="103" width="543.0" height="160" rx="14" fill="#f5f8fc" stroke="#d4dee9" stroke-width="2"/><rect x="614.0" y="105" width="8" height="156" rx="4" fill="#94702c" stroke="none" stroke-width="2"/><text x="883.5" y="154.5" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="30" font-weight="700" fill="#94702c" text-anchor="middle">侵害及违法性判断</text><text x="883.5" y="196.5" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="25" font-weight="400" fill="#203047" text-anchor="middle">是否侵害受到法律保护的权益，是否存在相</text><text x="883.5" y="230.5" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="25" font-weight="400" fill="#203047" text-anchor="middle">应违法或义务违反？</text><rect x="45.0" y="287" width="543.0" height="145" rx="14" fill="#f5f8fc" stroke="#d4dee9" stroke-width="2"/><rect x="47.0" y="289" width="8" height="141" rx="4" fill="#7960a6" stroke="none" stroke-width="2"/><text x="316.5" y="331.0" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="30" font-weight="700" fill="#7960a6" text-anchor="middle">归责依据</text><text x="316.5" y="373.0" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="25" font-weight="400" fill="#203047" text-anchor="middle">是否具有过错，或者是否适用其他责任基础</text><text x="316.5" y="407.0" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="25" font-weight="400" fill="#203047" text-anchor="middle">？</text><rect x="612.0" y="287" width="543.0" height="145" rx="14" fill="#f5f8fc" stroke="#d4dee9" stroke-width="2"/><rect x="614.0" y="289" width="8" height="141" rx="4" fill="#247e82" stroke="none" stroke-width="2"/><text x="883.5" y="348.0" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="30" font-weight="700" fill="#247e82" text-anchor="middle">损害</text><text x="883.5" y="390.0" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="25" font-weight="400" fill="#203047" text-anchor="middle">是否产生依法具有救济意义的损害？</text><rect x="45.0" y="456" width="543.0" height="145" rx="14" fill="#f5f8fc" stroke="#d4dee9" stroke-width="2"/><rect x="47.0" y="458" width="8" height="141" rx="4" fill="#64748b" stroke="none" stroke-width="2"/><text x="316.5" y="517.0" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="30" font-weight="700" fill="#64748b" text-anchor="middle">因果关系</text><text x="316.5" y="559.0" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="25" font-weight="400" fill="#203047" text-anchor="middle">行为与损害之间是否具有法律上的关联？</text></svg>