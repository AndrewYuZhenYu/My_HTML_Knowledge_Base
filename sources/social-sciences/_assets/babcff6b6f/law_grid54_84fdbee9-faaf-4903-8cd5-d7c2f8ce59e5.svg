<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="339" viewBox="0 0 1200 339"><rect x="0" y="0" width="1200" height="339" rx="0" fill="#ffffff" stroke="none" stroke-width="2"/><text x="600.0" y="49" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="34" font-weight="700" fill="#203047" text-anchor="middle">正当化与免责</text><line x1="45" y1="75" x2="1155" y2="75" stroke="#d4dee9" stroke-width="2" /><rect x="45.0" y="103" width="543.0" height="194" rx="14" fill="#f5f8fc" stroke="#d4dee9" stroke-width="2"/><rect x="47.0" y="105" width="8" height="190" rx="4" fill="#2563a6" stroke="none" stroke-width="2"/><text x="316.5" y="154.5" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="30" font-weight="700" fill="#2563a6" text-anchor="middle">正当化 Justification</text><text x="316.5" y="196.5" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="25" font-weight="400" fill="#203047" text-anchor="middle">行为在相应条件下具有法律允许或正当化依</text><text x="316.5" y="230.5" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="25" font-weight="400" fill="#203047" text-anchor="middle">据。正当防卫、紧急避险等可能属于此类分</text><text x="316.5" y="264.5" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="25" font-weight="400" fill="#203047" text-anchor="middle">析</text><rect x="612.0" y="103" width="543.0" height="194" rx="14" fill="#f5f8fc" stroke="#d4dee9" stroke-width="2"/><rect x="614.0" y="105" width="8" height="190" rx="4" fill="#94702c" stroke="none" stroke-width="2"/><text x="883.5" y="154.5" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="30" font-weight="700" fill="#94702c" text-anchor="middle">免责 Excuse</text><text x="883.5" y="196.5" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="25" font-weight="400" fill="#203047" text-anchor="middle">即使行为具有违法性质，行为人的个人责任</text><text x="883.5" y="230.5" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="25" font-weight="400" fill="#203047" text-anchor="middle">也可能因特定事由受到排除或限制。责任能</text><text x="883.5" y="264.5" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="25" font-weight="400" fill="#203047" text-anchor="middle">力、胁迫等可能涉及此类问题</text></svg>