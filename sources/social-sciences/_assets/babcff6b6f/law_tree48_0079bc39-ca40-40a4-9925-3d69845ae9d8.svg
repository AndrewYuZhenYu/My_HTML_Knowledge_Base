<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="607" viewBox="0 0 1200 607"><rect x="0" y="0" width="1200" height="607" rx="0" fill="#ffffff" stroke="none" stroke-width="2"/><text x="600.0" y="49" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="34" font-weight="700" fill="#203047" text-anchor="middle">竞争法的核心结构</text><line x1="45" y1="75" x2="1155" y2="75" stroke="#d4dee9" stroke-width="2" /><line x1="68" y1="151.0" x2="68" y2="511.0" stroke="#2563a6" stroke-width="4" /><line x1="68" y1="151.0" x2="103" y2="151.0" stroke="#2563a6" stroke-width="3" /><circle cx="68" cy="151.0" r="5" fill="#2563a6" stroke="none" stroke-width="2" opacity="1"/><rect x="103" y="100" width="1052" height="102" rx="14" fill="#f5f8fc" stroke="#d4dee9" stroke-width="2"/><rect x="105" y="102" width="8" height="98" rx="4" fill="#2563a6" stroke="none" stroke-width="2"/><text x="629.0" y="139.5" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="30" font-weight="700" fill="#2563a6" text-anchor="middle">限制竞争协议</text><text x="629.0" y="181.5" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="25" font-weight="400" fill="#203047" text-anchor="middle">多个经营者之间形成具有相关限制竞争效果的协议或协调行为</text><line x1="68" y1="271.0" x2="103" y2="271.0" stroke="#2563a6" stroke-width="3" /><circle cx="68" cy="271.0" r="5" fill="#2563a6" stroke="none" stroke-width="2" opacity="1"/><rect x="103" y="220" width="1052" height="102" rx="14" fill="#f5f8fc" stroke="#d4dee9" stroke-width="2"/><rect x="105" y="222" width="8" height="98" rx="4" fill="#94702c" stroke="none" stroke-width="2"/><text x="629.0" y="259.5" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="30" font-weight="700" fill="#94702c" text-anchor="middle">滥用市场支配地位</text><text x="629.0" y="301.5" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="25" font-weight="400" fill="#203047" text-anchor="middle">具有相应市场力量的经营者实施符合违法条件的行为</text><line x1="68" y1="391.0" x2="103" 