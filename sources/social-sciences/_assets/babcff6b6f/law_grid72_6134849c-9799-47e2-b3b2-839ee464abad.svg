<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="966" viewBox="0 0 1200 966"><rect x="0" y="0" width="1200" height="966" rx="0" fill="#ffffff" stroke="none" stroke-width="2"/><text x="600.0" y="49" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="34" font-weight="700" fill="#203047" text-anchor="middle">合同法律风险的分析框架</text><line x1="45" y1="75" x2="1155" y2="75" stroke="#d4dee9" stroke-width="2" /><rect x="45.0" y="103" width="543.0" height="145" rx="14" fill="#f5f8fc" stroke="#d4dee9" stroke-width="2"/><rect x="47.0" y="105" width="8" height="141" rx="4" fill="#2563a6" stroke="none" stroke-width="2"/><text x="316.5" y="164.0" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="30" font-weight="700" fill="#2563a6" text-anchor="middle">主体</text><text x="316.5" y="206.0" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="25" font-weight="400" fill="#203047" text-anchor="middle">与谁交易？对方是否具有相应权限？</text><rect x="612.0" y="103" width="543.0" height="145" rx="14" fill="#f5f8fc" stroke="#d4dee9" stroke-width="2"/><rect x="614.0" y="105" width="8" height="141" rx="4" fill="#94702c" stroke="none" stroke-width="2"/><text x="883.5" y="164.0" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="30" font-weight="700" fill="#94702c" text-anchor="middle">对象</text><text x="883.5" y="206.0" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="25" font-weight="400" fill="#203047" text-anchor="middle">双方交易的内容是否清晰、合法？</text><rect x="45.0" y="272" width="543.0" height="145" rx="14" fill="#f5f8fc" stroke="#d4dee9" stroke-width="2"/><rect x="47.0" y="274" width="8" height="141" rx="4" fill="#7960a6" stroke="none" stroke-width="2"/><text x="316.5" y="333.0" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="30" font-weight="700" fill="#7960a6" text-anchor="middle">义务</text><text x="316.5" y="375.0" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="25" font-weight="400" fill="#203047" text-anchor="middle">谁应当在什么时间完成哪些工作？</text><rect x="612.0" y="272" width="543.0" height="145" rx="14" fill="#f5f8fc" stroke="#d4dee9" stroke-width="2"/><rect x="614.0" y="274" width="8" height="141" rx="4" fill="#247e82" stroke="none" stroke-width="2"/><text x="883.5" y="333.0" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="30" font-weight="700" fill="#247e82" text-anchor="middle">验收</text><text x="883.5" y="375.0" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="25" font-weight="400" fill="#203047" text-anchor="middle">如何判断工作已经达到要求？</text><rect x="45.0" y="441" width="543.0" height="145" rx="14" fill="#f5f8fc" stroke="#d4dee9" stroke-width="2"/><rect x="47.0" y="443" width="8" height="141" rx="4" fill="#64748b" stroke="none" stroke-width="2"/><text x="316.5" y="502.0" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="30" font-weight="700" fill="#64748b" text-anchor="middle">支付</text><text x="316.5" y="544.0" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="25" font-weight="400" fill="#203047" text-anchor="middle">如何计价、付款及处理拖欠？</text><rect x="612.0" y="441" width="543.0" height="145" rx="14" fill="#f5f8fc" stroke="#d4dee9" stroke-width="2"/><rect x="614.0" y="443" width="8" height="141" rx="4" fill="#2563a6" stroke="none" stroke-width="2"/><text x="883.5" y="502.0" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="30" font-weight="700" fill="#2563a6" text-anchor="middle">风险</text><text x="883.5" y="544.0" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="25" font-weight="400" fill="#203047" text-anchor="middle">意外事件及履行困难由谁承担？</text><rect x="45.0" y="610" width="543.0" height="145" rx="14" fill="#f5f8fc" stroke="#d4dee9" stroke-width="2"/><rect x="47.0" y="612" width="8" height="141" rx="4" fill="#94702c" stroke="none" stroke-width="2"/><text x="316.5" y="671.0" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="30" font-weight="700" fill="#94702c" text-anchor="middle">责任</text><text x="316.5" y="713.0" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="25" font-weight="400" fill="#203047" text-anchor="middle">发生违约或损害后如何处理？</text><rect x="612.0" y="610" width="543.0" height="145" rx="14" fill="#f5f8fc" stroke="#d4dee9" stroke-width="2"/><rect x="614.0" y="612" width="8" height="141" rx="4" fill="#7960a6" stroke="none" stroke-width="2"/><text x="883.5" y="671.0" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="30" font-weight="700" fill="#7960a6" text-anchor="middle">退出</text><text x="883.5" y="713.0" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="25" font-weight="400" fill="#203047" text-anchor="middle">如何依法终止或调整合作？</text><rect x="45.0" y="779" width="543.0" height="145" rx="14" fill="#f5f8fc" stroke="#d4dee9" stroke-width="2"/><rect x="47.0" y="781" width="8" height="141" rx="4" fill="#247e82" stroke="none" stroke-width="2"/><text x="316.5" y="840.0" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="30" font-weight="700" fill="#247e82" text-anchor="middle">救济</text><text x="316.5" y="882.0" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="25" font-weight="400" fill="#203047" text-anchor="middle">发生争议后如何获得有效法律救济？</text></svg>