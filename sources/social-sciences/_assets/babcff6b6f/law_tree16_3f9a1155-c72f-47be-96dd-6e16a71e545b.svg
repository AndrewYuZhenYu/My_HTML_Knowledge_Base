<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="967" viewBox="0 0 1200 967"><rect x="0" y="0" width="1200" height="967" rx="0" fill="#ffffff" stroke="none" stroke-width="2"/><text x="600.0" y="49" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="34" font-weight="700" fill="#203047" text-anchor="middle">世界主要法律传统</text><line x1="45" y1="75" x2="1155" y2="75" stroke="#d4dee9" stroke-width="2" /><line x1="68" y1="166.0" x2="68" y2="871.0" stroke="#2563a6" stroke-width="4" /><line x1="68" y1="166.0" x2="103" y2="166.0" stroke="#2563a6" stroke-width="3" /><circle cx="68" cy="166.0" r="5" fill="#2563a6" stroke="none" stroke-width="2" opacity="1"/><rect x="103" y="100" width="1052" height="132" rx="14" fill="#f5f8fc" stroke="#d4dee9" stroke-width="2"/><rect x="105" y="102" width="8" height="128" rx="4" fill="#2563a6" stroke="none" stroke-width="2"/><text x="629.0" y="137.5" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="30" font-weight="700" fill="#2563a6" text-anchor="middle">大陆法传统 Civil Law</text><text x="629.0" y="179.5" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="25" font-weight="400" fill="#203047" text-anchor="middle">受到罗马法及欧洲大陆法律发展的深刻影响，重视系统化制定法及法典。法国、德国、日本</text><text x="629.0" y="213.5" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="25" font-weight="400" fill="#203047" text-anchor="middle">等</text><line x1="68" y1="316.0" x2="103" y2="316.0" stroke="#2563a6" stroke-width="3" /><circle cx="68" cy="316.0" r="5" fill="#2563a6" stroke="none" stroke-width="2" opacity="1"/><rect x="103" y="250" width="1052" height="132" rx="14" fill="#f5f8fc" stroke="#d4dee9" stroke-width="2"/><rect x="105" y="252" width="8" height="128" rx="4" fill="#94702c" stroke="none" stroke-width="2"/><text x="629.0" y="287.5" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="30" font-weight="700" fill="#94702c" text-anchor="middle">普通法传统 Common Law</text><text x="629.0" y="329.5" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="25" font-weight="400" fill="#203047" text-anchor="middle">源于英国法律历史，重视司法判例及其推理方式，同时广泛使用制定法。英格兰及威尔士、</text><text x="629.0" y="363.5" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="25" font-weight="400" fill="#203047" text-anchor="middle">美国、新加坡、中国香港等</text><line x1="68" y1="466.0" x2="103" y2="466.0" stroke="#2563a6" stroke-width="3" /><circle cx="68" cy="466.0" r="5" fill="#2563a6" stroke="none" stroke-width="2" opacity="1"/><rect x="103" y="400" width="1052" height="132" rx="14" fill="#f5f8fc" stroke="#d4dee9" stroke-width="2"/><rect x="105" y="402" width="8" height="128" rx="4" fill="#7960a6" stroke="none" stroke-width="2"/><text x="629.0" y="454.5" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="30" font-weight="700" fill="#7960a6" text-anchor="middle">宗教法传统 Religious Law</text><text x="629.0" y="496.5" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="25" font-weight="400" fill="#203047" text-anchor="middle">宗教规范及其解释传统在部分法律领域发挥重要作用，如部分国家及地区的家庭法、继承法</text><line x1="68" y1="601.0" x2="103" y2="601.0" stroke="#2563a6" stroke-width="3" /><circle cx="68" cy="601.0" r="5" fill="#2563a6" stroke="none" stroke-width="2" opacity="1"/><rect x="103" y="550" width="1052" height="102" rx="14" fill="#f5f8fc" stroke="#d4dee9" stroke-width="2"/><rect x="105" y="552" width="8" height="98" rx="4" fill="#247e82" stroke="none" stroke-width="2"/><text x="629.0" y="589.5" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="30" font-weight="700" fill="#247e82" text-anchor="middle">习惯法传统 Customary Law</text><text x="629.0" y="631.5" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="25" font-weight="400" fill="#203047" text-anchor="middle">在相应制度承认下，将地方共同体长期形成的习惯作为法律依据</text><line x1="68" y1="736.0" x2="103" y2="736.0" stroke="#2563a6" stroke-width="3" /><circle cx="68" cy="736.0" r="5" fill="#2563a6" stroke="none" stroke-width="2" opacity="1"/><rect x="103" y="670" width="1052" height="132" rx="14" fill="#f5f8fc" stroke="#d4dee9" stroke-width="2"/><rect x="105" y="672" width="8" height="128" rx="4" fill="#64748b" stroke="none" stroke-width="2"/><text x="629.0" y="707.5" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="30" font-weight="700" fill="#64748b" text-anchor="middle">社会主义法律传统及现代发展</text><text x="629.0" y="749.5" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="25" font-weight="400" fill="#203047" text-anchor="middle">从社会主义国家的制度、法律思想及历史发展角度研究法律。中国等国家具有各自独特的制</text><text x="629.0" y="783.5" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="25" font-weight="400" fill="#203047" text-anchor="middle">度演进</text><line x1="68" y1="871.0" x2="103" y2="871.0" stroke="#2563a6" stroke-width="3" /><circle cx="68" cy="871.0" r="5" fill="#2563a6" stroke="none" stroke-width="2" opacity="1"/><rect x="103" y="820" width="1052" height="102" rx="14" fill="#f5f8fc" stroke="#d4dee9" stroke-width="2"/><rect x="105" y="822" width="8" height="98" rx="4" fill="#2563a6" stroke="none" stroke-width="2"/><text x="629.0" y="859.5" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="30" font-weight="700" fill="#2563a6" text-anchor="middle">混合法律体系 Mixed Systems</text><text x="629.0" y="901.5" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="25" font-weight="400" fill="#203047" text-anchor="middle">同时具有多种法律传统的重要制度特征。南非、苏格兰、加拿大魁北克等</text></svg>