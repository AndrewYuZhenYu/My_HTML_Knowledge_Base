<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="474" viewBox="0 0 1200 474"><rect x="0" y="0" width="1200" height="474" rx="0" fill="#ffffff" stroke="none" stroke-width="2"/><text x="600.0" y="49" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="34" font-weight="700" fill="#203047" text-anchor="middle">法律责任的主要类型</text><line x1="45" y1="75" x2="1155" y2="75" stroke="#d4dee9" stroke-width="2" /><rect x="45.0" y="103" width="543.0" height="145" rx="14" fill="#f5f8fc" stroke="#d4dee9" stroke-width="2"/><rect x="47.0" y="105" width="8" height="141" rx="4" fill="#2563a6" stroke="none" stroke-width="2"/><text x="316.5" y="164.0" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="30" font-weight="700" fill="#2563a6" text-anchor="middle">民事责任</text><text x="316.5" y="206.0" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="25" font-weight="400" fill="#203047" text-anchor="middle">赔偿损失、履行义务、停止侵害等</text><rect x="612.0" y="103" width="543.0" height="145" rx="14" fill="#f5f8fc" stroke="#d4dee9" stroke-width="2"/><rect x="614.0" y="105" width="8" height="141" rx="4" fill="#94702c" stroke="none" stroke-width="2"/><text x="883.5" y="164.0" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="30" font-weight="700" fill="#94702c" text-anchor="middle">刑事责任</text><text x="883.5" y="206.0" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="25" font-weight="400" fill="#203047" text-anchor="middle">犯罪所引起的刑事法律后果</text><rect x="45.0" y="272" width="543.0" height="160" rx="14" fill="#f5f8fc" stroke="#d4dee9" stroke-width="2"/><rect x="47.0" y="274" width="8" height="156" rx="4" fill="#7960a6" stroke="none" stroke-width="2"/><text x="316.5" y="323.5" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="30" font-weight="700" fill="#7960a6" text-anchor="middle">行政责任</text><text x="316.5" y="365.5" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="25" font-we