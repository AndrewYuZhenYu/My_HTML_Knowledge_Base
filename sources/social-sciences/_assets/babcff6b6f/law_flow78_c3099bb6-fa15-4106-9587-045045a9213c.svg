ns CJK SC, Noto Sans CJK, sans-serif" font-size="25" font-weight="400" fill="#203047" text-anchor="middle">是否已经生效、修订、废止或存在过渡规定？</text><line x1="600" y1="795" x2="600" y2="829" stroke="#64748b" stroke-width="3" /><polygon points="600.00,829.00 593.77,817.59 606.23,817.59" fill="#64748b" stroke="#64748b" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/><rect x="115.0" y="833" width="970" height="104" rx="14" fill="#f5f8fc" stroke="#d4dee9" stroke-width="2"/><rect x="117.0" y="835" width="8" height="100" rx="4" fill="#2563a6" stroke="none" stroke-width="2"/><text x="600.0" y="873.5" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="30" font-weight="700" fill="#2563a6" text-anchor="middle">检查适用范围及例外</text><text x="600.0" y="915.5" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="25" font-weight="400" fill="#203047" text-anchor="middle">主体、行业、金额、行为及其他条件</text><line x1="600" y1="941" x2="600" y2="975" stroke="#64748b" stroke-width="3" /><polygon points="600.00,975.00 593.77,963.59 606.23,963.59" fill="#64748b" stroke="#64748b" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/><rect x="115.0" y="979" width="970" height="104" rx="14" fill="#f5f8fc" stroke="#d4dee9" stroke-width="2"/><rect x="117.0" y="981" width="8" height="100" rx="4" fill="#94702c" stroke="none" stroke-width="2"/><text x="600.0" y="1019.5" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="30" font-weight="700" fill="#94702c" text-anchor="middle">进行解释与事实分析</text><text x="600.0" y="1061.5" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="25" font-weight="400" fill="#203047" text-anchor="middle">结合相关制度及具体证据判断</text></svg>