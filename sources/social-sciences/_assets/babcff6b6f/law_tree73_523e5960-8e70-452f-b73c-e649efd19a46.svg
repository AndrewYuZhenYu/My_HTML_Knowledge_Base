ns-serif" font-size="25" font-weight="400" fill="#203047" text-anchor="middle">有哪些具有相应法律效力的规范？</text><line x1="68" y1="751.0" x2="103" y2="751.0" stroke="#2563a6" stroke-width="3" /><circle cx="68" cy="751.0" r="5" fill="#2563a6" stroke="none" stroke-width="2" opacity="1"/><rect x="103" y="700" width="1052" height="102" rx="14" fill="#f5f8fc" stroke="#d4dee9" stroke-width="2"/><rect x="105" y="702" width="8" height="98" rx="4" fill="#2563a6" stroke="none" stroke-width="2"/><text x="629.0" y="739.5" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="30" font-weight="700" fill="#2563a6" text-anchor="middle">权利义务</text><text x="629.0" y="781.5" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="25" font-weight="400" fill="#203047" text-anchor="middle">各方具有怎样的权利及义务？</text><line x1="68" y1="871.0" x2="103" y2="871.0" stroke="#2563a6" stroke-width="3" /><circle cx="68" cy="871.0" r="5" fill="#2563a6" stroke="none" stroke-width="2" opacity="1"/><rect x="103" y="820" width="1052" height="102" rx="14" fill="#f5f8fc" stroke="#d4dee9" stroke-width="2"/><rect x="105" y="822" width="8" height="98" rx="4" fill="#94702c" stroke="none" stroke-width="2"/><text x="629.0" y="859.5" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="30" font-weight="700" fill="#94702c" text-anchor="middle">责任</text><text x="629.0" y="901.5" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="25" font-weight="400" fill="#203047" text-anchor="middle">是否满足相应法律责任的构成条件？</text><line x1="68" y1="991.0" x2="103" y2="991.0" stroke="#2563a6" stroke-width="3" /><circle cx="68" cy="991.0" r="5" fill="#2563a6" stroke="none" stroke-width="2" opacity="1"/><rect x="103" y="940" width="1052" height="102" rx="14" fill="#f5f8fc" stroke="#d4dee9" stroke-width="2"/><rect x="105" y="942" width="8" height="98" rx="4" fill="#7960a6" stroke="none" stroke-width="2"/><text x="629.0" y="979.5" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size