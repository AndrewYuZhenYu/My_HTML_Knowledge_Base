<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="643" viewBox="0 0 1200 643"><rect x="0" y="0" width="1200" height="643" rx="0" fill="#ffffff" stroke="none" stroke-width="2"/><text x="600.0" y="49" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="34" font-weight="700" fill="#203047" text-anchor="middle">证据的主要评价维度</text><line x1="45" y1="75" x2="1155" y2="75" stroke="#d4dee9" stroke-width="2" /><rect x="45.0" y="103" width="543.0" height="160" rx="14" fill="#f5f8fc" stroke="#d4dee9" stroke-width="2"/><rect x="47.0" y="105" width="8" height="156" rx="4" fill="#2563a6" stroke="none" stroke-width="2"/><text x="316.5" y="171.5" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="30" font-weight="700" fill="#2563a6" text-anchor="middle">关联性</text><text x="316.5" y="213.5" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="25" font-weight="400" fill="#203047" text-anchor="middle">证据是否与需要证明的事实具有相关联系？</text><rect x="612.0" y="103" width="543.0" height="160" rx="14" fill="#f5f8fc" stroke="#d4dee9" stroke-width="2"/><rect x="614.0" y="105" width="8" height="156" rx="4" fill="#94702c" stroke="none" stroke-width="2"/><text x="883.5" y="154.5" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="30" font-weight="700" fill="#94702c" text-anchor="middle">真实性</text><text x="883.5" y="196.5" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="25" font-weight="400" fill="#203047" text-anchor="middle">证据是否确实来自所声称的来源，是否经过</text><text x="883.5" y="230.5" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="25" font-weight="400" fill="#203047" text-anchor="middle">篡改？</text><rect x="45.0" y="287" width="543.0" height="145" rx="14" fill="#f5f8fc" stroke="#d4dee9" stroke-width="2"/><rect x="47.0" y="289" width="8" height="141" rx="4" fill="#7960a6" stroke="none" stroke-width="2"/><text x="316.5" y="348.0" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="30"