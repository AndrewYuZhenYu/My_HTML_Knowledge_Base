<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1147" viewBox="0 0 1200 1147"><rect x="0" y="0" width="1200" height="1147" rx="0" fill="#ffffff" stroke="none" stroke-width="2"/><text x="600.0" y="49" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="34" font-weight="700" fill="#203047" text-anchor="middle">主要法学思想流派</text><line x1="45" y1="75" x2="1155" y2="75" stroke="#d4dee9" stroke-width="2" /><line x1="68" y1="151.0" x2="68" y2="1036.0" stroke="#2563a6" stroke-width="4" /><line x1="68" y1="151.0" x2="103" y2="151.0" stroke="#2563a6" stroke-width="3" /><circle cx="68" cy="151.0" r="5" fill="#2563a6" stroke="none" stroke-width="2" opacity="1"/><rect x="103" y="100" width="1052" height="102" rx="14" fill="#f5f8fc" stroke="#d4dee9" stroke-width="2"/><rect x="105" y="102" width="8" height="98" rx="4" fill="#2563a6" stroke="none" stroke-width="2"/><text x="629.0" y="139.5" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="30" font-weight="700" fill="#2563a6" text-anchor="middle">自然法理论</text><text x="629.0" y="181.5" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="25" font-weight="400" fill="#203047" text-anchor="middle">关注法律与道德、理性及正义之间的关系。阿奎那、格劳秀斯、洛克、富勒等</text><line x1="68" y1="271.0" x2="103" y2="271.0" stroke="#2563a6" stroke-width="3" /><circle cx="68" cy="271.0" r="5" fill="#2563a6" stroke="none" stroke-width="2" opacity="1"/><rect x="103" y="220" width="1052" height="102" rx="14" fill="#f5f8fc" stroke="#d4dee9" stroke-width="2"/><rect x="105" y="222" width="8" height="98" rx="4" fill="#94702c" stroke="none" stroke-width="2"/><text x="629.0" y="259.5" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="30" font-weight="700" fill="#94702c" text-anchor="middle">法律实证主义</text><text x="629.0" y="301.5" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="25" font-weight="400" fill="#203047" text-anchor="middle">强调法律的存在及效力与其社会来源和制度标准的关系。奥斯丁、凯尔森、哈特等</text><line x1="68" y1="391.0" x2="103" y2="391.0" stroke="#2563a6" stroke-width="3" /><circle cx="68" cy="391.0" r="5" fill="#2563a6" stroke="none" stroke-width="2" opacity="1"/><rect x="103" y="340" width="1052" height="102" rx="14" fill="#f5f8fc" stroke="#d4dee9" stroke-width="2"/><rect x="105" y="342" width="8" height="98" rx="4" fill="#7960a6" stroke="none" stroke-width="2"/><text x="629.0" y="379.5" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="30" font-weight="700" fill="#7960a6" text-anchor="middle">历史法学派</text><text x="629.0" y="421.5" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="25" font-weight="400" fill="#203047" text-anchor="middle">强调法律与历史传统、社会习俗及文化演进的联系。萨维尼等</text><line x1="68" y1="511.0" x2="103" y2="511.0" stroke="#2563a6" stroke-width="3" /><circle cx="68" cy="511.0" r="5" fill="#2563a6" stroke="none" stroke-width="2" opacity="1"/><rect x="103" y="460" width="1052" height="102" rx="14" fill="#f5f8fc" stroke="#d4dee9" stroke-width="2"/><rect x="105" y="462" width="8" height="98" rx="4" fill="#247e82" stroke="none" stroke-width="2"/><text x="629.0" y="499.5" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="30" font-weight="700" fill="#247e82" text-anchor="middle">社会法学</text><text x="629.0" y="541.5" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="25" font-weight="400" fill="#203047" text-anchor="middle">关注法律在社会生活中的实际功能及社会利益协调。庞德等</text><line x1="68" y1="631.0" x2="103" y2="631.0" stroke="#2563a6" stroke-width="3" /><circle cx="68" cy="631.0" r="5" fill="#2563a6" stroke="none" stroke-width="2" opacity="1"/><rect x="103" y="580" width="1052" height="102" rx="14" fill="#f5f8fc" stroke="#d4dee9" stroke-width="2"/><rect x="105" y="582" width="8" height="98" rx="4" fill="#64748b" stroke="none" stroke-width="2"/><text x="629.0" y="619.5" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="30" font-weight="700" fill="#64748b" text-anchor="middle">法律现实主义</text><text x="629.0" y="661.5" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="25" font-weight="400" fill="#203047" text-anchor="middle">研究司法决定实际如何形成及法律运行中的现实因素。霍姆斯、卢埃林等</text><line x1="68" y1="766.0" x2="103" y2="766.0" stroke="#2563a6" stroke-width="3" /><circle cx="68" cy="766.0" r="5" fill="#2563a6" stroke="none" stroke-width="2" opacity="1"/><rect x="103" y="700" width="1052" height="132" rx="14" fill="#f5f8fc" stroke="#d4dee9" stroke-width="2"/><rect x="105" y="702" width="8" height="128" rx="4" fill="#2563a6" stroke="none" stroke-width="2"/><text x="629.0" y="754.5" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="30" font-weight="700" fill="#2563a6" text-anchor="middle">马克思主义法学</text><text x="629.0" y="796.5" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="25" font-weight="400" fill="#203047" text-anchor="middle">从物质生产、社会关系、阶级、国家及社会发展研究法律。马克思、恩格斯及后续理论发展</text><line x1="68" y1="901.0" x2="103" y2="901.0" stroke="#2563a6" stroke-width="3" /><circle cx="68" cy="901.0" r="5" fill="#2563a6" stroke="none" stroke-width="2" opacity="1"/><rect x="103" y="850" width="1052" height="102" rx="14" fill="#f5f8fc" stroke="#d4dee9" stroke-width="2"/><rect x="105" y="852" width="8" height="98" rx="4" fill="#94702c" stroke="none" stroke-width="2"/><text x="629.0" y="889.5" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="30" font-weight="700" fill="#94702c" text-anchor="middle">法律解释主义</text><text x="629.0" y="931.5" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="25" font-weight="400" fill="#203047" text-anchor="middle">强调法律实践中的原则、制度历史与正当性解释。德沃金等</text><line x1="68" y1="1036.0" x2="103" y2="1036.0" stroke="#2563a6" stroke-width="3" /><circle cx="68" cy="1036.0" r="5" fill="#2563a6" stroke="none" stroke-width="2" opacity="1"/><rect x="103" y="970" width="1052" height="132" rx="14" fill="#f5f8fc" stroke="#d4dee9" stroke-width="2"/><rect x="105" y="972" width="8" height="128" rx="4" fill="#7960a6" stroke="none" stroke-width="2"/><text x="629.0" y="1007.5" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="30" font-weight="700" fill="#7960a6" text-anchor="middle">现代批判与交叉法学</text><text x="629.0" y="1049.5" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="25" font-weight="400" fill="#203047" text-anchor="middle">研究法律中的权力、利益、性别、经济激励及社会结构。批判法学、女性主义法学、法律经</text><text x="629.0" y="1083.5" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="25" font-weight="400" fill="#203047" text-anchor="middle">济学等</text></svg>