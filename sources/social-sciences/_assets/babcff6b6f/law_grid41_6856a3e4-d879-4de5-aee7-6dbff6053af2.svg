<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="305" viewBox="0 0 1200 305"><rect x="0" y="0" width="1200" height="305" rx="0" fill="#ffffff" stroke="none" stroke-width="2"/><text x="600.0" y="49" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="34" font-weight="700" fill="#203047" text-anchor="middle">股权及股东权利</text><line x1="45" y1="75" x2="1155" y2="75" stroke="#d4dee9" stroke-width="2" /><rect x="45.0" y="103" width="543.0" height="160" rx="14" fill="#f5f8fc" stroke="#d4dee9" stroke-width="2"/><rect x="47.0" y="105" width="8" height="156" rx="4" fill="#2563a6" stroke="none" stroke-width="2"/><text x="316.5" y="154.5" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="30" font-weight="700" fill="#2563a6" text-anchor="middle">经济性权益</text><text x="316.5" y="196.5" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="25" font-weight="400" fill="#203047" text-anchor="middle">利润分配权益、剩余财产分配权益、股权转</text><text x="316.5" y="230.5" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="25" font-weight="400" fill="#203047" text-anchor="middle">让相关权益</text><rect x="612.0" y="103" width="543.0" height="160" rx="14" fill="#f5f8fc" stroke="#d4dee9" stroke-width="2"/><rect x="614.0" y="105" width="8" height="156" rx="4" fill="#94702c" stroke="none" stroke-width="2"/><text x="883.5" y="171.5" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="30" font-weight="700" fill="#94702c" text-anchor="middle">治理及参与权益</text><text x="883.5" y="213.5" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="25" font-weight="400" fill="#203047" text-anchor="middle">表决权、知情权、提案及参与决策等权利</text></svg>