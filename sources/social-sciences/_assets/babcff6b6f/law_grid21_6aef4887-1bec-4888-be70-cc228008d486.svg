<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="628" viewBox="0 0 1200 628"><rect x="0" y="0" width="1200" height="628" rx="0" fill="#ffffff" stroke="none" stroke-width="2"/><text x="600.0" y="49" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="34" font-weight="700" fill="#203047" text-anchor="middle">行政权力的法律边界</text><line x1="45" y1="75" x2="1155" y2="75" stroke="#d4dee9" stroke-width="2" /><rect x="45.0" y="103" width="543.0" height="145" rx="14" fill="#f5f8fc" stroke="#d4dee9" stroke-width="2"/><rect x="47.0" y="105" width="8" height="141" rx="4" fill="#2563a6" stroke="none" stroke-width="2"/><text x="316.5" y="164.0" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="30" font-weight="700" fill="#2563a6" text-anchor="middle">主体合法</text><text x="316.5" y="206.0" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="25" font-weight="400" fill="#203047" text-anchor="middle">作出决定的机关是否具有相应资格？</text><rect x="612.0" y="103" width="543.0" height="145" rx="14" fill="#f5f8fc" stroke="#d4dee9" stroke-width="2"/><rect x="614.0" y="105" width="8" height="141" rx="4" fill="#94702c" stroke="none" stroke-width="2"/><text x="883.5" y="164.0" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="30" font-weight="700" fill="#94702c" text-anchor="middle">权限合法</text><text x="883.5" y="206.0" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="25" font-weight="400" fill="#203047" text-anchor="middle">是否超出法定权力范围？</text><rect x="45.0" y="272" width="543.0" height="145" rx="14" fill="#f5f8fc" stroke="#d4dee9" stroke-width="2"/><rect x="47.0" y="274" width="8" height="141" rx="4" fill="#7960a6" stroke="none" stroke-width="2"/><text x="316.5" y="333.0" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="30" font-weight="700" fill="#7960a6" text-anchor="middle">依据合法</text><text x="316.5" y="375.0" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="25" font-weight="400" fill="#203047" text-anchor="middle">是否具有适用的法律依据？</text><rect x="612.0" y="272" width="543.0" height="145" rx="14" fill="#f5f8fc" stroke="#d4dee9" stroke-width="2"/><rect x="614.0" y="274" width="8" height="141" rx="4" fill="#247e82" stroke="none" stroke-width="2"/><text x="883.5" y="333.0" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="30" font-weight="700" fill="#247e82" text-anchor="middle">事实清楚</text><text x="883.5" y="375.0" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="25" font-weight="400" fill="#203047" text-anchor="middle">决定是否建立在充分事实基础上？</text><rect x="45.0" y="441" width="543.0" height="145" rx="14" fill="#f5f8fc" stroke="#d4dee9" stroke-width="2"/><rect x="47.0" y="443" width="8" height="141" rx="4" fill="#64748b" stroke="none" stroke-width="2"/><text x="316.5" y="502.0" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="30" font-weight="700" fill="#64748b" text-anchor="middle">程序正当</text><text x="316.5" y="544.0" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="25" font-weight="400" fill="#203047" text-anchor="middle">是否遵循应有程序及参与保障？</text><rect x="612.0" y="441" width="543.0" height="145" rx="14" fill="#f5f8fc" stroke="#d4dee9" stroke-width="2"/><rect x="614.0" y="443" width="8" height="141" rx="4" fill="#2563a6" stroke="none" stroke-width="2"/><text x="883.5" y="502.0" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="30" font-weight="700" fill="#2563a6" text-anchor="middle">目的正当</text><text x="883.5" y="544.0" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="25" font-weight="400" fill="#203047" text-anchor="middle">是否为相应法律授权的目的行使权力？</text></svg>