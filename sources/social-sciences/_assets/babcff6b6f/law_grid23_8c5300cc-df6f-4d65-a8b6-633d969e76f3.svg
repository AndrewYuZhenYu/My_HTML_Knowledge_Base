<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="305" viewBox="0 0 1200 305"><rect x="0" y="0" width="1200" height="305" rx="0" fill="#ffffff" stroke="none" stroke-width="2"/><text x="600.0" y="49" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="34" font-weight="700" fill="#203047" text-anchor="middle">私人自治与特别保护</text><line x1="45" y1="75" x2="1155" y2="75" stroke="#d4dee9" stroke-width="2" /><rect x="45.0" y="103" width="543.0" height="160" rx="14" fill="#f5f8fc" stroke="#d4dee9" stroke-width="2"/><rect x="47.0" y="105" width="8" height="156" rx="4" fill="#2563a6" stroke="none" stroke-width="2"/><text x="316.5" y="154.5" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="30" font-weight="700" fill="#2563a6" text-anchor="middle">一般自治机制</text><text x="316.5" y="196.5" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="25" font-weight="400" fill="#203047" text-anchor="middle">允许当事人自行决定交易及权利安排，如自</text><text x="316.5" y="230.5" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="25" font-weight="400" fill="#203047" text-anchor="middle">由协商、合同约定、财产处分</text><rect x="612.0" y="103" width="543.0" height="160" rx="14" fill="#f5f8fc" stroke="#d4dee9" stroke-width="2"/><rect x="614.0" y="105" width="8" height="156" rx="4" fill="#94702c" stroke="none" stroke-width="2"/><text x="883.5" y="154.5" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="30" font-weight="700" fill="#94702c" text-anchor="middle">特别保护机制</text><text x="883.5" y="196.5" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="25" font-weight="400" fill="#203047" text-anchor="middle">应对实际能力差异及不公平风险，如消费者</text><text x="883.5" y="230.5" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="25" font-weight="400" fill="#203047" text-anchor="middle">保护、劳动保护、格式条款控制</text></svg>