<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="727" viewBox="0 0 1200 727"><rect x="0" y="0" width="1200" height="727" rx="0" fill="#ffffff" stroke="none" stroke-width="2"/><text x="600.0" y="49" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="34" font-weight="700" fill="#203047" text-anchor="middle">现代企业组织形式</text><line x1="45" y1="75" x2="1155" y2="75" stroke="#d4dee9" stroke-width="2" /><line x1="68" y1="151.0" x2="68" y2="631.0" stroke="#2563a6" stroke-width="4" /><line x1="68" y1="151.0" x2="103" y2="151.0" stroke="#2563a6" stroke-width="3" /><circle cx="68" cy="151.0" r="5" fill="#2563a6" stroke="none" stroke-width="2" opacity="1"/><rect x="103" y="100" width="1052" height="102" rx="14" fill="#f5f8fc" stroke="#d4dee9" stroke-width="2"/><rect x="105" y="102" width="8" height="98" rx="4" fill="#2563a6" stroke="none" stroke-width="2"/><text x="629.0" y="139.5" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="30" font-weight="700" fill="#2563a6" text-anchor="middle">个人经营及独资企业</text><text x="629.0" y="181.5" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="25" font-weight="400" fill="#203047" text-anchor="middle">主要由个人出资经营，责任规则依适用法律确定</text><line x1="68" y1="271.0" x2="103" y2="271.0" stroke="#2563a6" stroke-width="3" /><circle cx="68" cy="271.0" r="5" fill="#2563a6" stroke="none" stroke-width="2" opacity="1"/><rect x="103" y="220" width="1052" height="102" rx="14" fill="#f5f8fc" stroke="#d4dee9" stroke-width="2"/><rect x="105" y="222" width="8" height="98" rx="4" fill="#94702c" stroke="none" stroke-width="2"/><text x="629.0" y="259.5" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="30" font-weight="700" fill="#94702c" text-anchor="middle">合伙企业</text><text x="629.0" y="301.5" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="25" font-weight="400" fill="#203047" text-anchor="middle">多个合伙人按照相关协议及法律共同开展经营</text><line x1="68" y1="391.0" x2="103" y2="391.0" stroke="#2563a6" stroke-width="3" /><circle cx="68" cy="391.0" r="5" fill="#2563a6" stroke="none" stroke-width="2" opacity="1"/><rect x="103" y="340" width="1052" height="102" rx="14" fill="#f5f8fc" stroke="#d4dee9" stroke-width="2"/><rect x="105" y="342" width="8" height="98" rx="4" fill="#7960a6" stroke="none" stroke-width="2"/><text x="629.0" y="379.5" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="30" font-weight="700" fill="#7960a6" text-anchor="middle">有限责任公司</text><text x="629.0" y="421.5" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="25" font-weight="400" fill="#203047" text-anchor="middle">由出资人持有相应权益，通常承担有限责任</text><line x1="68" y1="511.0" x2="103" y2="511.0" stroke="#2563a6" stroke-width="3" /><circle cx="68" cy="511.0" r="5" fill="#2563a6" stroke="none" stroke-width="2" opacity="1"/><rect x="103" y="460" width="1052" height="102" rx="14" fill="#f5f8fc" stroke="#d4dee9" stroke-width="2"/><rect x="105" y="462" width="8" height="98" rx="4" fill="#247e82" stroke="none" stroke-width="2"/><text x="629.0" y="499.5" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="30" font-weight="700" fill="#247e82" text-anchor="middle">股份有限公司</text><text x="629.0" y="541.5" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="25" font-weight="400" fill="#203047" text-anchor="middle">资本划分为股份的公司组织形式</text><line x1="68" y1="631.0" x2="103" y2="631.0" stroke="#2563a6" stroke-width="3" /><circle cx="68" cy="631.0" r="5" fill="#2563a6" stroke="none" stroke-width="2" opacity="1"/><rect x="103" y="580" width="1052" height="102" rx="14" fill="#f5f8fc" stroke="#d4dee9" stroke-width="2"/><rect x="105" y="582" width="8" height="98" rx="4" fill="#64748b" stroke="none" stroke-width="2"/><text x="629.0" y="619.5" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="30" font-weight="700" fill="#64748b" text-anchor="middle">其他组织形式</text><text x="629.0" y="661.5" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="25" font-weight="400" fill="#203047" text-anchor="middle">合作社、特殊目的实体及其他依法建立的经营载体</text></svg>