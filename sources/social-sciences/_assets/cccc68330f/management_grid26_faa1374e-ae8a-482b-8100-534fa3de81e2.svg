<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="305" viewBox="0 0 1200 305"><rect x="0" y="0" width="1200" height="305" rx="0" fill="#ffffff" stroke="none" stroke-width="2"/><text x="600.0" y="49" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="34" font-weight="700" fill="#203047" text-anchor="middle">集权、分权与授权</text><line x1="45" y1="75" x2="1155" y2="75" stroke="#d4dee9" stroke-width="2" /><rect x="45.0" y="103" width="354.0" height="160" rx="14" fill="#f5f8fc" stroke="#d4dee9" stroke-width="2"/><rect x="47.0" y="105" width="8" height="156" rx="4" fill="#2563a6" stroke="none" stroke-width="2"/><text x="222.0" y="154.5" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="30" font-weight="700" fill="#2563a6" text-anchor="middle">集权</text><text x="222.0" y="196.5" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="25" font-weight="400" fill="#203047" text-anchor="middle">重要决策权相对集中于较高</text><text x="222.0" y="230.5" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="25" font-weight="400" fill="#203047" text-anchor="middle">层级</text><rect x="423.0" y="103" width="354.0" height="160" rx="14" fill="#f5f8fc" stroke="#d4dee9" stroke-width="2"/><rect x="425.0" y="105" width="8" height="156" rx="4" fill="#94702c" stroke="none" stroke-width="2"/><text x="600.0" y="154.5" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="30" font-weight="700" fill="#94702c" text-anchor="middle">分权</text><text x="600.0" y="196.5" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="25" font-weight="400" fill="#203047" text-anchor="middle">通过组织制度将部分决策权</text><text x="600.0" y="230.5" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="25" font-weight="400" fill="#203047" text-anchor="middle">配置给较低层级</text><rect x="801.0" y="103" width="354.0" height="160" rx="14" fill="#f5f8fc" stroke="#d4dee9" stroke-width="2"/><rect x="803.0" y="105" width="8" height="156" rx="4" fill="#7960a6" stroke="none" stroke-width="2"/><text x="978.0" y="154.5" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="30" font-weight="700" fill="#7960a6" text-anchor="middle">授权</text><text x="978.0" y="196.5" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="25" font-weight="400" fill="#203047" text-anchor="middle">管理者将特定任务及相应权</text><text x="978.0" y="230.5" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="25" font-weight="400" fill="#203047" text-anchor="middle">限交给其他人员</text></svg>