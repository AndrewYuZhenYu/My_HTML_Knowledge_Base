ound" stroke-linecap="round"/><rect x="115.0" y="395" width="970" height="104" rx="14" fill="#f5f8fc" stroke="#d4dee9" stroke-width="2"/><rect x="117.0" y="397" width="8" height="100" rx="4" fill="#7960a6" stroke="none" stroke-width="2"/><text x="600.0" y="435.5" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="30" font-weight="700" fill="#7960a6" text-anchor="middle">P — 市场定位 Positioning</text><text x="600.0" y="477.5" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="25" font-weight="400" fill="#203047" text-anchor="middle">确定产品希望在目标客户认知中形成的独特价值</text></svg>