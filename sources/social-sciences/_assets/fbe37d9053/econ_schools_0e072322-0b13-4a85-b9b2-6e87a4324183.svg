<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1125" viewBox="0 0 1000 1125" font-family="Noto Sans CJK SC, sans-serif"><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L7 3.5 L0 7 Z" fill="#8296ad"/></marker></defs><rect width="100%" height="100%" fill="white"/><rect x="50" y="24" width="900" height="123" rx="14" fill="#ffffff" stroke="#3979c9" stroke-width="2.5"/><text x="500.0" y="73.63" font-size="34" font-weight="650" text-anchor="middle" fill="#3979c9">早期财富研究</text><text x="500.0" y="127.53" font-size="28" font-weight="400" text-anchor="middle" fill="#203247">重商主义、重农主义：财富从哪里来？</text><line x1="500.0" y1="147" x2="500.0" y2="177" stroke="#8296ad" stroke-width="3" marker-end="url(#arrow)"/><rect x="50" y="182" width="900" height="123" rx="14" fill="#ffffff" stroke="#16877b" stroke-width="2.5"/><text x="500.0" y="231.63" font-size="34" font-weight="650" text-anchor="middle" fill="#16877b">古典政治经济学</text><text x="500.0" y="285.53" font-size="28" font-weight="400" text-anchor="middle" fill="#203247">分工、劳动、价值和国家财富如何形成？</text><line x1="500.0" y1="305" x2="500.0" y2="335" stroke="#8296ad" stroke-width="3" marker-end="url(#arrow)"/><rect x="50" y="340" width="900" height="123" rx="14" fill="#ffffff" stroke="#a48342" stroke-width="2.5"/><text x="500.0" y="389.63" font-size="34" font-weight="650" text-anchor="middle" fill="#a48342">马克思主义政治经济学</text><text x="500.0" y="443.53" font-size="28" font-weight="400" text-anchor="middle" fill="#203247">资本、生产关系和社会利益分配如何运行？</text><line x1="500.0" y1="463" x2="500.0" y2="493" stroke="#8296ad" stroke-width="3" marker-end="url(#arrow)"/><rect x="50" y="498" width="900" height="123" rx="14" fill="#ffffff" stroke="#8870ae" stroke-width="2.5"/><text x="500.0" y="547.63" font-size="34" font-weight="650" text-anchor="middle" fill="#8870ae">边际革命与新古典经济学</text><text x="500.0" y="601.53" font-size="28" font-weight="400" text-anchor="middle" fill="#203247">个人如何选择，价格与市场均衡如何形成？</text><line x1="500.0" y1="621" x2="500.0" y2="651" stroke="#8296ad" stroke-width="3" marker-end="url(#arrow)"/><rect x="50" y="656" width="900" height="123" rx="14" fill="#ffffff" stroke="#3979c9" stroke-width="2.5"/><text x="500.0" y="705.63" font-size="34" font-weight="650" text-anchor="middle" fill="#3979c9">凯恩斯主义革命</text><text x="500.0" y="759.53" font-size="28" font-weight="400" text-anchor="middle" fill="#203247">为什么市场经济可能出现严重失业和经济衰退？</text><line x1="500.0" y1="779" x2="500.0" y2="809" stroke="#8296ad" stroke-width="3" marker-end="url(#arrow)"/><rect x="50" y="814" width="900" height="123" rx="14" fill="#ffffff" stroke="#16877b" stroke-width="2.5"/><text x="500.0" y="863.63" font-size="34" font-weight="650" text-anchor="middle" fill="#16877b">现代宏观经济学的发展</text><text x="500.0" y="917.53" font-size="28" font-weight="400" text-anchor="middle" fill="#203247">货币、预期、市场摩擦和宏观政策如何相互影响？</text><line x1="500.0" y1="937" x2="500.0" y2="967" stroke="#8296ad" stroke-width="3" marker-end="url(#arrow)"/><rect x="50" y="972" width="900" height="123" rx="14" fill="#ffffff" stroke="#a48342" stroke-width="2.5"/><text x="500.0" y="1021.63" font-size="34" font-weight="650" text-anchor="middle" fill="#a48342">现代经济学的多元发展</text><text x="500.0" y="1075.53" font-size="28" font-weight="400" text-anchor="middle" fill="#203247">制度、信息、心理、技术和复杂系统如何影响经济？</text></svg>