<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8" fill="#879aac"/></marker></defs><rect width="1200" height="380" fill="white"/><text x="600" y="44.0" font-family="Noto Sans CJK SC, sans-serif" font-size="32" fill="#23374b" text-anchor="middle" dominant-baseline="central" font-weight="700"><tspan x="600" dy="0">权责发生制：收入确认与收款</tspan></text><path d="M125 190 L1070 190" stroke="#879aac" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><circle cx="290" cy="190" r="10" fill="#3979b8" fill-opacity="1" stroke="#3979b8" stroke-width="2"/><circle cx="910" cy="190" r="10" fill="#a68142" fill-opacity="1" stroke="#a68142" stroke-width="2"/><text x="290" y="125.0" font-family="Noto Sans CJK SC, sans-serif" font-size="27" fill="#23374b" text-anchor="middle" dominant-baseline="central" font-weight="400"><tspan x="290" dy="0">11月：履约，确认收入10万元</tspan></text><text x="910" y="125.0" font-family="Noto Sans CJK SC, sans-serif" font-size="27" fill="#23374b" text-anchor="middle" dominant-baseline="central" font-weight="400"><tspan x="910" dy="0">12月：客户付款10万元</tspan></text><text x="290" y="264.0" font-family="Noto Sans CJK SC, sans-serif" font-size="28" fill="#23374b" text-anchor="middle" dominant-baseline="central" font-weight="400"><tspan x="290" dy="0">形成应收账款</tspan></text><text x="910" y="264.0" font-family="Noto Sans CJK SC, sans-serif" font-size="28" fill="#23374b" text-anchor="middle" dominant-baseline="central" font-weight="400"><tspan x="910" dy="0">应收账款减少</tspan></text><text x="600" y="345.0" font-family="Noto Sans CJK SC, sans-serif" font-size="25" fill="#23374b" text-anchor="middle" dominant-baseline="central" font-weight="400"><tspan x="600" dy="0">收入确认与实际收款可以发生在不同期间</tspan></text></svg>