 y2="391.0" stroke="#2563a6" stroke-width="3" /><circle cx="68" cy="391.0" r="5" fill="#2563a6" stroke="none" stroke-width="2" opacity="1"/><rect x="103" y="340" width="1052" height="102" rx="14" fill="#f5f8fc" stroke="#d4dee9" stroke-width="2"/><rect x="105" y="342" width="8" height="98" rx="4" fill="#7960a6" stroke="none" stroke-width="2"/><text x="629.0" y="379.5" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="30" font-weight="700" fill="#7960a6" text-anchor="middle">焦虑或恐惧相关障碍</text><text x="629.0" y="421.5" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="25" font-weight="400" fill="#203047" text-anchor="middle">广泛性焦虑、惊恐障碍、社交焦虑、特定恐惧症等</text><line x1="68" y1="511.0" x2="103" y2="511.0" stroke="#2563a6" stroke-width="3" /><circle cx="68" cy="511.0" r="5" fill="#2563a6" stroke="none" stroke-width="2" opacity="1"/><rect x="103" y="460" width="1052" height="102" rx="14" fill="#f5f8fc" stroke="#d4dee9" stroke-width="2"/><rect x="105" y="462" width="8" height="98" rx="4" fill="#247e82" stroke="none" stroke-width="2"/><text x="629.0" y="499.5" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="30" font-weight="700" fill="#247e82" text-anchor="middle">强迫及相关障碍</text><text x="629.0" y="541.5" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="25" font-weight="400" fill="#203047" text-anchor="middle">强迫障碍、躯体变形障碍、囤积障碍等</text><line x1="68" y1="631.0" x2="103" y2="631.0" stroke="#2563a6" stroke-width="3" /><circle cx="68" cy="631.0" r="5" fill="#2563a6" stroke="none" stroke-width="2" opacity="1"/><rect x="103" y="580" width="1052" height="102" rx="14" fill="#f5f8fc" stroke="#d4dee9" stroke-width="2"/><rect x="105" y="582" width="8" height="98" rx="4" fill="#64748b" stroke="none" stroke-width="2"/><text x="629.0" y="619.5" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="30" font-weight="700" fill="#64748b" text-anchor="middle">应激相关障碍</text><text x="629.0" y="661.5" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="25" font-weight="400" fill="#203047" text-anchor="middle">创伤后应激障碍、复杂性创伤后应激障碍、适应障碍等</text><line x1="68" y1="751.0" x2="103" y2="751.0" stroke="#2563a6" stroke-width="3" /><circle cx="68" cy="751.0" r="5" fill="#2563a6" stroke="none" stroke-width="2" opacity="1"/><rect x="103" y="700" width="1052" height="102" rx="14" fill="#f5f8fc" stroke="#d4dee9" stroke-width="2"/><rect x="105" y="702" width="8" height="98" rx="4" fill="#2563a6" stroke="none" stroke-width="2"/><text x="629.0" y="739.5" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="30" font-weight="700" fill="#2563a6" text-anchor="middle">精神分裂症及其他原发性精神病性障碍</text><text x="629.0" y="781.5" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="25" font-weight="400" fill="#203047" text-anchor="middle">精神分裂症、分裂情感性障碍、妄想障碍等</text><line x1="68" y1="871.0" x2="103" y2="871.0" stroke="#2563a6" stroke-width="3" /><circle cx="68" cy="871.0" r="5" fill="#2563a6" stroke="none" stroke-width="2" opacity="1"/><rect x="103" y="820" width="1052" height="102" rx="14" fill="#f5f8fc" stroke="#d4dee9" stroke-width="2"/><rect x="105" y="822" width="8" height="98" rx="4" fill="#94702c" stroke="none" stroke-width="2"/><text x="629.0" y="859.5" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="30" font-weight="700" fill="#94702c" text-anchor="middle">人格障碍及相关特征</text><text x="629.0" y="901.5" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="25" font-weight="400" fill="#203047" text-anchor="middle">持续性人格功能受损、适应不良的人格特质模式</text><line x1="68" y1="991.0" x2="103" y2="991.0" stroke="#2563a6" stroke-width="3" /><circle cx="68" cy="991.0" r="5" fill="#2563a6" stroke="none" stroke-width="2" opacity="1"/><rect x="103" y="940" width="1052" height="102" rx="14" fill="#f5f8fc" stroke="#d4dee9" stroke-width="2"/><rect x="105" y="942" width="8" height="98" rx="4" fill="#7960a6" stroke="none" stroke-width="2"/><text x="629.0" y="9