<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="373" viewBox="0 0 1200 373"><rect x="0" y="0" width="1200" height="373" rx="0" fill="#ffffff" stroke="none" stroke-width="2"/><text x="600.0" y="49" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="34" font-weight="700" fill="#203047" text-anchor="middle">经济心理学、行为经济学与行为金融学</text><line x1="45" y1="75" x2="1155" y2="75" stroke="#d4dee9" stroke-width="2" /><rect x="45.0" y="103" width="354.0" height="228" rx="14" fill="#f5f8fc" stroke="#d4dee9" stroke-width="2"/><rect x="47.0" y="105" width="8" height="224" rx="4" fill="#2563a6" stroke="none" stroke-width="2"/><text x="222.0" y="171.5" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="30" font-weight="700" fill="#2563a6" text-anchor="middle">经济心理学</text><text x="222.0" y="213.5" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="25" font-weight="400" fill="#203047" text-anchor="middle">以心理科学为基础研究经济</text><text x="222.0" y="247.5" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="25" font-weight="400" fill="#203047" text-anchor="middle">行为（消费、储蓄、劳动、</text><text x="222.0" y="281.5" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="25" font-weight="400" fill="#203047" text-anchor="middle">经济安全感、金钱观）</text><rect x="423.0" y="103" width="354.0" height="228" rx="14" fill="#f5f8fc" stroke="#d4dee9" stroke-width="2"/><rect x="425.0" y="105" width="8" height="224" rx="4" fill="#94702c" stroke="none" stroke-width="2"/><text x="600.0" y="154.5" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="30" font-weight="700" fill="#94702c" text-anchor="middle">行为经济学</text><text x="600.0" y="196.5" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="25" font-weight="400" fill="#203047" text-anchor="middle">将心理学证据引入经济决策</text><text x="600.0" y="230.5" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="25" font-weight="400" fill="#203047" text-anchor="middle">及制度分析（有限理性、偏</text><text x="600.0" y="264.5" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="25" font-weight="400" fill="#203047" text-anchor="middle">好、选择架构、公平与合作</text><text x="600.0" y="298.5" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="25" font-weight="400" fill="#203047" text-anchor="middle">）</text><rect x="801.0" y="103" width="354.0" height="228" rx="14" fill="#f5f8fc" stroke="#d4dee9" stroke-width="2"/><rect x="803.0" y="105" width="8" height="224" rx="4" fill="#7960a6" stroke="none" stroke-width="2"/><text x="978.0" y="154.5" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="30" font-weight="700" fill="#7960a6" text-anchor="middle">行为金融学</text><text x="978.0" y="196.5" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="25" font-weight="400" fill="#203047" text-anchor="middle">研究心理及行为因素如何影</text><text x="978.0" y="230.5" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="25" font-weight="400" fill="#203047" text-anchor="middle">响投资者与金融市场（投资</text><text x="978.0" y="264.5" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="25" font-weight="400" fill="#203047" text-anchor="middle">偏差、交易行为、资产定价</text><text x="978.0" y="298.5" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="25" font-weight="400" fill="#203047" text-anchor="middle">、套利限制）</text></svg>