<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="660" viewBox="0 0 1200 660"><rect x="0" y="0" width="1200" height="660" rx="0" fill="#ffffff" stroke="none" stroke-width="2"/><text x="600.0" y="49" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="34" font-weight="700" fill="#203047" text-anchor="middle">强化与惩罚的四种组合</text><line x1="45" y1="75" x2="1155" y2="75" stroke="#d4dee9" stroke-width="2" /><text x="418" y="113" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="27" font-weight="400" fill="#203047" text-anchor="middle">增加某种刺激（正）</text><text x="893" y="113" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="27" font-weight="400" fill="#203047" text-anchor="middle">移除某种刺激（负）</text><text x="90" y="245" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="23" font-weight="400" fill="#203047" text-anchor="middle">行为增加</text><text x="90" y="465" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="23" font-weight="400" fill="#203047" text-anchor="middle">行为减少</text><rect x="180" y="130" width="463" height="208" rx="14" fill="#f5f8fc" stroke="#d4dee9" stroke-width="2"/><rect x="182" y="132" width="8" height="204" rx="4" fill="#2563a6" stroke="none" stroke-width="2"/><text x="411.5" y="205.5" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="30" font-weight="700" fill="#2563a6" text-anchor="middle">正强化</text><text x="411.5" y="247.5" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="25" font-weight="400" fill="#203047" text-anchor="middle">增加刺激，行为增加</text><text x="411.5" y="281.5" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="25" font-weight="400" fill="#203047" text-anchor="middle">完成任务后获得奖励</text><rect x="655" y="130" width="463" height="208" rx="14" fill="#f5f8fc" stroke="#d4dee9" stroke-width="2"/><rect x="657" y="132" width="8" height="204" rx="4" fill="#94702c" stroke="none" stroke-width="2"/><text x="886.5" y="205.5" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="30" font-weight="700" fill="#94702c" text-anchor="middle">负强化</text><text x="886.5" y="247.5" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="25" font-weight="400" fill="#203047" text-anchor="middle">移除刺激，行为增加</text><text x="886.5" y="281.5" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="25" font-weight="400" fill="#203047" text-anchor="middle">系安全带后提示音停止</text><rect x="180" y="350" width="463" height="208" rx="14" fill="#f5f8fc" stroke="#d4dee9" stroke-width="2"/><rect x="182" y="352" width="8" height="204" rx="4" fill="#7960a6" stroke="none" stroke-width="2"/><text x="411.5" y="425.5" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="30" font-weight="700" fill="#7960a6" text-anchor="middle">正惩罚</text><text x="411.5" y="467.5" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="25" font-weight="400" fill="#203047" text-anchor="middle">增加刺激，行为减少</text><text x="411.5" y="501.5" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="25" font-weight="400" fill="#203047" text-anchor="middle">违规后增加不利后果</text><rect x="655" y="350" width="463" height="208" rx="14" fill="#f5f8fc" stroke="#d4dee9" stroke-width="2"/><rect x="657" y="352" width="8" height="204" rx="4" fill="#247e82" stroke="none" stroke-width="2"/><text x="886.5" y="425.5" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="30" font-weight="700" fill="#247e82" text-anchor="middle">负惩罚</text><text x="886.5" y="467.5" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="25" font-weight="400" fill="#203047" text-anchor="middle">移除刺激，行为减少</text><text x="886.5" y="501.5" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="25" font-weight="400" fill="#203047" text-anchor="middle">违规后失去相关权限</text></svg>