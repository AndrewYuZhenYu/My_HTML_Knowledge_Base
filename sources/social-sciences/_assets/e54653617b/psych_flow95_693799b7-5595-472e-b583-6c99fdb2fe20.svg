<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="733" viewBox="0 0 1200 733"><rect x="0" y="0" width="1200" height="733" rx="0" fill="#ffffff" stroke="none" stroke-width="2"/><text x="600.0" y="49" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="34" font-weight="700" fill="#203047" text-anchor="middle">市场情绪与价格的反馈循环</text><line x1="45" y1="75" x2="1155" y2="75" stroke="#d4dee9" stroke-width="2" /><rect x="115.0" y="103" width="970" height="82" rx="14" fill="#f5f8fc" stroke="#d4dee9" stroke-width="2"/><rect x="117.0" y="105" width="8" height="78" rx="4" fill="#2563a6" stroke="none" stroke-width="2"/><text x="600.0" y="154.0" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="30" font-weight="700" fill="#2563a6" text-anchor="middle">投资者接收新闻、价格及社会信息</text><line x1="600" y1="189" x2="600" y2="223" stroke="#64748b" stroke-width="3" /><polygon points="600.00,223.00 593.77,211.59 606.23,211.59" fill="#64748b" stroke="#64748b" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/><rect x="115.0" y="227" width="970" height="82" rx="14" fill="#f5f8fc" stroke="#d4dee9" stroke-width="2"/><rect x="117.0" y="229" width="8" height="78" rx="4" fill="#94702c" stroke="none" stroke-width="2"/><text x="600.0" y="278.0" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="30" font-weight="700" fill="#94702c" text-anchor="middle">形成盈利预期、风险判断与情绪反应</text><line x1="600" y1="313" x2="600" y2="347" stroke="#64748b" stroke-width="3" /><polygon points="600.00,347.00 593.77,335.59 606.23,335.59" fill="#64748b" stroke="#64748b" stroke-width="1" stroke-linejoin="round" stroke-linecap="round"/><rect x="115.0" y="351" width="970" height="82" rx="14" fill="#f5f8fc" stroke="#d4dee9" stroke-width="2"/><rect x="117.0" y="353" width="8" height="78" rx="4" fill="#7960a6" stroke="none" stroke-width="2"/><text x="600.0" y="402.0" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="30" font-weight="700" fill="#7960a