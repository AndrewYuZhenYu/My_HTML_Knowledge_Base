<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="967" viewBox="0 0 1200 967"><rect x="0" y="0" width="1200" height="967" rx="0" fill="#ffffff" stroke="none" stroke-width="2"/><text x="600.0" y="49" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="34" font-weight="700" fill="#203047" text-anchor="middle">主要心理治疗流派</text><line x1="45" y1="75" x2="1155" y2="75" stroke="#d4dee9" stroke-width="2" /><line x1="68" y1="151.0" x2="68" y2="871.0" stroke="#2563a6" stroke-width="4" /><line x1="68" y1="151.0" x2="103" y2="151.0" stroke="#2563a6" stroke-width="3" /><circle cx="68" cy="151.0" r="5" fill="#2563a6" stroke="none" stroke-width="2" opacity="1"/><rect x="103" y="100" width="1052" height="102" rx="14" fill="#f5f8fc" stroke="#d4dee9" stroke-width="2"/><rect x="105" y="102" width="8" height="98" rx="4" fill="#2563a6" stroke="none" stroke-width="2"/><text x="629.0" y="139.5" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="30" font-weight="700" fill="#2563a6" text-anchor="middle">行为治疗</text><text x="629.0" y="181.5" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="25" font-weight="400" fill="#203047" text-anchor="middle">利用学习原理改变适应不良的行为及联结（暴露治疗、行为激活、行为训练）</text><line x1="68" y1="271.0" x2="103" y2="271.0" stroke="#2563a6" stroke-width="3" /><circle cx="68" cy="271.0" r="5" fill="#2563a6" stroke="none" stroke-width="2" opacity="1"/><rect x="103" y="220" width="1052" height="102" rx="14" fill="#f5f8fc" stroke="#d4dee9" stroke-width="2"/><rect x="105" y="222" width="8" height="98" rx="4" fill="#94702c" stroke="none" stroke-width="2"/><text x="629.0" y="259.5" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="30" font-weight="700" fill="#94702c" text-anchor="middle">认知治疗与认知行为疗法</text><text x="629.0" y="301.5" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="25" font-weight="400" fill="#203047" text-anchor="middle">研究认知、情绪与行为之间的维持关系（CT、CBT、REBT）</text><line x1="68" y1="391.0" x2="103" y2="391.0" stroke="#2563a6" stroke-width="3" /><circle cx="68" cy="391.0" r="5" fill="#2563a6" stroke="none" stroke-width="2" opacity="1"/><rect x="103" y="340" width="1052" height="102" rx="14" fill="#f5f8fc" stroke="#d4dee9" stroke-width="2"/><rect x="105" y="342" width="8" height="98" rx="4" fill="#7960a6" stroke="none" stroke-width="2"/><text x="629.0" y="379.5" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="30" font-weight="700" fill="#7960a6" text-anchor="middle">心理动力学治疗</text><text x="629.0" y="421.5" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="25" font-weight="400" fill="#203047" text-anchor="middle">探索情绪、内部冲突及关系模式（短程与长程）</text><line x1="68" y1="511.0" x2="103" y2="511.0" stroke="#2563a6" stroke-width="3" /><circle cx="68" cy="511.0" r="5" fill="#2563a6" stroke="none" stroke-width="2" opacity="1"/><rect x="103" y="460" width="1052" height="102" rx="14" fill="#f5f8fc" stroke="#d4dee9" stroke-width="2"/><rect x="105" y="462" width="8" height="98" rx="4" fill="#247e82" stroke="none" stroke-width="2"/><text x="629.0" y="499.5" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="30" font-weight="700" fill="#247e82" text-anchor="middle">人本主义与体验性治疗</text><text x="629.0" y="541.5" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="25" font-weight="400" fill="#203047" text-anchor="middle">主观体验、自我理解及治疗关系（来访者中心、情绪聚焦）</text><line x1="68" y1="631.0" x2="103" y2="631.0" stroke="#2563a6" stroke-width="3" /><circle cx="68" cy="631.0" r="5" fill="#2563a6" stroke="none" stroke-width="2" opacity="1"/><rect x="103" y="580" width="1052" height="102" rx="14" fill="#f5f8fc" stroke="#d4dee9" stroke-width="2"/><rect x="105" y="582" width="8" height="98" rx="4" fill="#64748b" stroke="none" stroke-width="2"/><text x="629.0" y="619.5" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="30" font-weight="700" fill="#64748b" text-anchor="middle">接纳与正念相关治疗</text><text x="629.0" y="661.5" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="25" font-weight="400" fill="#203047" text-anchor="middle">心理灵活性及与内部体验的关系（ACT、MBCT、DBT中的相关方法）</text><line x1="68" y1="751.0" x2="103" y2="751.0" stroke="#2563a6" stroke-width="3" /><circle cx="68" cy="751.0" r="5" fill="#2563a6" stroke="none" stroke-width="2" opacity="1"/><rect x="103" y="700" width="1052" height="102" rx="14" fill="#f5f8fc" stroke="#d4dee9" stroke-width="2"/><rect x="105" y="702" width="8" height="98" rx="4" fill="#2563a6" stroke="none" stroke-width="2"/><text x="629.0" y="739.5" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="30" font-weight="700" fill="#2563a6" text-anchor="middle">家庭与系统治疗</text><text x="629.0" y="781.5" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="25" font-weight="400" fill="#203047" text-anchor="middle">关系模式及家庭系统（家庭、伴侣治疗）</text><line x1="68" y1="871.0" x2="103" y2="871.0" stroke="#2563a6" stroke-width="3" /><circle cx="68" cy="871.0" r="5" fill="#2563a6" stroke="none" stroke-width="2" opacity="1"/><rect x="103" y="820" width="1052" height="102" rx="14" fill="#f5f8fc" stroke="#d4dee9" stroke-width="2"/><rect x="105" y="822" width="8" height="98" rx="4" fill="#94702c" stroke="none" stroke-width="2"/><text x="629.0" y="859.5" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="30" font-weight="700" fill="#94702c" text-anchor="middle">其他专门及整合治疗</text><text x="629.0" y="901.5" font-family="Noto Sans CJK SC, Noto Sans CJK, sans-serif" font-size="25" font-weight="400" fill="#203047" text-anchor="middle">特定问题或综合理论（IPT、EMDR、图式治疗）</text></svg>