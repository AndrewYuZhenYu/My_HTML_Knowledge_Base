<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8" fill="#879aac"/></marker></defs><rect width="1200" height="630" fill="white"/><text x="600" y="44.0" font-family="Noto Sans CJK SC, sans-serif" font-size="32" fill="#23374b" text-anchor="middle" dominant-baseline="central" font-weight="700"><tspan x="600" dy="0">中国政治制度基本组织框架</tspan></text><rect x="125.0" y="87.5" width="950" height="65" rx="12" fill="#e7eff6" stroke="#3979b8" stroke-width="2"/><text x="600" y="120.0" font-family="Noto Sans CJK SC, sans-serif" font-size="26" fill="#23374b" text-anchor="middle" dominant-baseline="central" font-weight="400"><tspan x="600" dy="0">中国共产党领导：重要宪制及政治基础</tspan></text><rect x="125.0" y="180.0" width="950" height="90" rx="12" fill="#e7eff6" stroke="#3979b8" stroke-width="2"/><text x="600" y="210.12" font-family="Noto Sans CJK SC, sans-serif" font-size="24" fill="#23374b" text-anchor="middle" dominant-baseline="central" font-weight="400"><tspan x="600" dy="0">全国人民代表大会及其常务委员会</tspan><tspan x="600" dy="29.759999999999998">最高国家权力机关及其常设机关</tspan></text><text x="600" y="300.0" font-family="Noto Sans CJK SC, sans-serif" font-size="21" fill="#23374b" text-anchor="middle" dominant-baseline="central" font-weight="400"><tspan x="600" dy="0">国家机关的产生、负责及监督等制度关系</tspan></text><path d="M600 330 L150 385" stroke="#879aac" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="13.0" y="385.0" width="274" height="90" rx="12" fill="#e7eff6" stroke="#3979b8" stroke-width="2"/><text x="150" y="416.98" font-family="Noto Sans CJK SC, sans-serif" font-size="21" fill="#23374b" text-anchor="middle" dominant-baseline="central" font-weight="400"><tspan x="150" dy="0">国务院</tspan><tspan x="150" dy="26.04">最高国家行政机关</tspan></text><path d="M600 330 L450 385" stroke="#879aac" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rec