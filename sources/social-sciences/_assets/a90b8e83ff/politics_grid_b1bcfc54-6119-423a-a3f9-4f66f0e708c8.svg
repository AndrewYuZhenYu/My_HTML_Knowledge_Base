<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="848" viewBox="0 0 1200 848"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8" fill="#879aac"/></marker></defs><rect width="1200" height="848" fill="white"/><text x="600" y="44.0" font-family="Noto Sans CJK SC, sans-serif" font-size="32" fill="#23374b" text-anchor="middle" dominant-baseline="central" font-weight="700"><tspan x="600" dy="0">政治学的十二个核心问题</tspan></text><rect x="29.0" y="92.5" width="552" height="105" rx="12" fill="#e7eff6" stroke="#3979b8" stroke-width="2"/><text x="305" y="145.0" font-family="Noto Sans CJK SC, sans-serif" font-size="22" fill="#23374b" text-anchor="middle" dominant-baseline="central" font-weight="400"><tspan x="305" dy="0">为什么需要政治：公共事务、利益协调、集体决策</tspan></text><rect x="619.0" y="92.5" width="552" height="105" rx="12" fill="#f4f0e8" stroke="#a68142" stroke-width="2"/><text x="895" y="145.0" font-family="Noto Sans CJK SC, sans-serif" font-size="22" fill="#23374b" text-anchor="middle" dominant-baseline="central" font-weight="400"><tspan x="895" dy="0">权力从何而来：资源、组织及权威</tspan></text><rect x="29.0" y="214.5" width="552" height="105" rx="12" fill="#efedf5" stroke="#7966a8" stroke-width="2"/><text x="305" y="267.0" font-family="Noto Sans CJK SC, sans-serif" font-size="22" fill="#23374b" text-anchor="middle" dominant-baseline="central" font-weight="400"><tspan x="305" dy="0">权力为什么获认可：合法性、制度及支持</tspan></text><rect x="619.0" y="214.5" width="552" height="105" rx="12" fill="#e5f0ef" stroke="#258478" stroke-width="2"/><text x="895" y="267.0" font-family="Noto Sans CJK SC, sans-serif" font-size="22" fill="#23374b" text-anchor="middle" dominant-baseline="central" font-weight="400"><tspan x="895" dy="0">国家为什么形成：起源、主权及秩序</tspan></text><rect x="29.0" y="336.5" width="552" height="105" rx="12" fill="#edf0f3" stroke="#69839b" stroke-width="2"/><text x="305" y="389.0" font-family="Noto Sans CJK SC, sans-serif" font-size="