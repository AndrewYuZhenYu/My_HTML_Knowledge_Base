<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0 L8 4 L0 8" fill="#879aac"/></marker></defs><rect width="1200" height="800" fill="white"/><text x="600" y="44.0" font-family="Noto Sans CJK SC, sans-serif" font-size="32" fill="#23374b" text-anchor="middle" dominant-baseline="central" font-weight="700"><tspan x="600" dy="0">政治思想的历史发展</tspan></text><rect x="80.0" y="85.0" width="1040" height="70" rx="12" fill="#e7eff6" stroke="#3979b8" stroke-width="2"/><text x="600" y="120.0" font-family="Noto Sans CJK SC, sans-serif" font-size="22" fill="#23374b" text-anchor="middle" dominant-baseline="central" font-weight="400"><tspan x="600" dy="0">古代：治理、德治、法治、共同体及正当性</tspan></text><path d="M600 155 L600 185" stroke="#879aac" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="80.0" y="185.0" width="1040" height="70" rx="12" fill="#f4f0e8" stroke="#a68142" stroke-width="2"/><text x="600" y="220.0" font-family="Noto Sans CJK SC, sans-serif" font-size="22" fill="#23374b" text-anchor="middle" dominant-baseline="central" font-weight="400"><tspan x="600" dy="0">中世纪：宗教与世俗权力、君主及自然法</tspan></text><path d="M600 255 L600 285" stroke="#879aac" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="80.0" y="285.0" width="1040" height="70" rx="12" fill="#efedf5" stroke="#7966a8" stroke-width="2"/><text x="600" y="320.0" font-family="Noto Sans CJK SC, sans-serif" font-size="22" fill="#23374b" text-anchor="middle" dominant-baseline="central" font-weight="400"><tspan x="600" dy="0">近代国家：主权、社会契约、权力集中与个人权利</tspan></text><path d="M600 355 L600 385" stroke="#879aac" stroke-width="2.5" fill="none" marker-end="url(#arrow)"/><rect x="80.0" y="385.0" width="1040" height="70" rx="12" fill="#e5f0ef" stroke="#258478" stroke-width="2"/><text x="600" y="420.0" font-family="Noto Sans CJK SC, sans-serif" font-size="22" fill="#23374b"