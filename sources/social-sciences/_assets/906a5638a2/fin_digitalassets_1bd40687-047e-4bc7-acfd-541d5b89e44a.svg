<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="906" viewBox="0 0 1100 906" font-family="Noto Sans CJK SC, sans-serif"><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L7 3.5 L0 7 Z" fill="#8296ad"/></marker></defs><rect width="100%" height="100%" fill="white"/><rect x="35" y="22" width="1030" height="86" rx="14" fill="#ffffff" stroke="#3979c9" stroke-width="2.5"/><text x="550.0" y="77.42" font-size="36" font-weight="650" text-anchor="middle" fill="#3979c9">数字形式的货币与金融资产</text><line x1="76" y1="108" x2="76" y2="823.0" stroke="#8296ad" stroke-width="3"/><line x1="76" y1="193.0" x2="114" y2="193.0" stroke="#8296ad" stroke-width="3"/><rect x="114" y="140" width="950" height="106" rx="14" fill="#ffffff" stroke="#3979c9" stroke-width="2.5"/><text x="589.0" y="179.74" font-size="32" font-weight="650" text-anchor="middle" fill="#3979c9">中央银行数字货币</text><text x="589.0" y="227.88000000000002" font-size="29" font-weight="400" text-anchor="middle" fill="#203247">中央银行的数字货币负债</text><line x1="76" y1="319.0" x2="114" y2="319.0" stroke="#8296ad" stroke-width="3"/><rect x="114" y="266" width="950" height="106" rx="14" fill="#ffffff" stroke="#16877b" stroke-width="2.5"/><text x="589.0" y="305.74" font-size="32" font-weight="650" text-anchor="middle" fill="#16877b">银行存款及代币化存款</text><text x="589.0" y="353.88" font-size="29" font-weight="400" text-anchor="middle" fill="#203247">商业银行相关存款债权的数字表达</text><line x1="76" y1="445.0" x2="114" y2="445.0" stroke="#8296ad" stroke-width="3"/><rect x="114" y="392" width="950" height="106" rx="14" fill="#ffffff" stroke="#a48342" stroke-width="2.5"/><text x="589.0" y="431.74" font-size="32" font-weight="650" text-anchor="middle" fill="#a48342">电子货币</text><text x="589.0" y="479.88" font-size="29" font-weight="400" text-anchor="middle" fill="#203247">按照相关制度发行和管理的电子储值等货币价值</text><line x1="76" y1="571.0" x2="114" y2="571.0" stroke="#8296ad" stroke-width="3"/><rect x="114" y="518" width="950" height="106" rx="14" fill="#ffffff" stroke="#8870ae" stroke-width="2.5"/><text x="589.0" y="557.74" font-size="32" font-weight="650" text-anchor="middle" fill="#8870ae">稳定币</text><text x="589.0" y="605.8800000000001" font-size="29" font-weight="400" text-anchor="middle" fill="#203247">尝试维持与特定资产或货币价值稳定联系的代币</text><line x1="76" y1="697.0" x2="114" y2="697.0" stroke="#8296ad" stroke-width="3"/><rect x="114" y="644" width="950" height="106" rx="14" fill="#ffffff" stroke="#3979c9" stroke-width="2.5"/><text x="589.0" y="683.74" font-size="32" font-weight="650" text-anchor="middle" fill="#3979c9">原生加密资产</text><text x="589.0" y="731.8800000000001" font-size="29" font-weight="400" text-anchor="middle" fill="#203247">依赖相关网络机制形成、通常不属于中央银行负债的资产</text><line x1="76" y1="823.0" x2="114" y2="823.0" stroke="#8296ad" stroke-width="3"/><rect x="114" y="770" width="950" height="106" rx="14" fill="#ffffff" stroke="#16877b" stroke-width="2.5"/><text x="589.0" y="809.74" font-size="32" font-weight="650" text-anchor="middle" fill="#16877b">代币化金融资产</text><text x="589.0" y="857.8800000000001" font-size="29" font-weight="400" text-anchor="middle" fill="#203247">通过数字代币表示证券、基金等相关资产权利</text></svg>