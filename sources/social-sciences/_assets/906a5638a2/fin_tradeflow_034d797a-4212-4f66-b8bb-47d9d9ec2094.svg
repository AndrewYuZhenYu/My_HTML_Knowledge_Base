<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="967" viewBox="0 0 1000 967" font-family="Noto Sans CJK SC, sans-serif"><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L7 3.5 L0 7 Z" fill="#8296ad"/></marker></defs><rect width="100%" height="100%" fill="white"/><rect x="50" y="24" width="900" height="123" rx="14" fill="#ffffff" stroke="#3979c9" stroke-width="2.5"/><text x="500.0" y="73.63" font-size="34" font-weight="650" text-anchor="middle" fill="#3979c9">交易指令</text><text x="500.0" y="121.41000000000001" font-size="28" font-weight="400" text-anchor="middle" fill="#203247">投资者提交买入或卖出委托</text><line x1="500.0" y1="147" x2="500.0" y2="177" stroke="#8296ad" stroke-width="3" marker-end="url(#arrow)"/><rect x="50" y="182" width="900" height="123" rx="14" fill="#ffffff" stroke="#16877b" stroke-width="2.5"/><text x="500.0" y="231.63" font-size="34" font-weight="650" text-anchor="middle" fill="#16877b">订单路由与撮合</text><text x="500.0" y="279.40999999999997" font-size="28" font-weight="400" text-anchor="middle" fill="#203247">交易系统匹配订单或接收交易报价</text><line x1="500.0" y1="305" x2="500.0" y2="335" stroke="#8296ad" stroke-width="3" marker-end="url(#arrow)"/><rect x="50" y="340" width="900" height="123" rx="14" fill="#ffffff" stroke="#a48342" stroke-width="2.5"/><text x="500.0" y="389.63" font-size="34" font-weight="650" text-anchor="middle" fill="#a48342">成交确认</text><text x="500.0" y="437.41" font-size="28" font-weight="400" text-anchor="middle" fill="#203247">确定成交价格、数量等合同条件</text><line x1="500.0" y1="463" x2="500.0" y2="493" stroke="#8296ad" stroke-width="3" marker-end="url(#arrow)"/><rect x="50" y="498" width="900" height="123" rx="14" fill="#ffffff" stroke="#8870ae" stroke-width="2.5"/><text x="500.0" y="547.63" font-size="34" font-weight="650" text-anchor="middle" fill="#8870ae">清算</text><text x="500.0" y="595.4100000000001" font-size="28" font-weight="400" text-anchor="middle" fill="#