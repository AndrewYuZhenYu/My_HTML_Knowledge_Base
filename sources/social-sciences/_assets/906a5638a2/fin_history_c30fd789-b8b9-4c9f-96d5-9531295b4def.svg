<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1125" viewBox="0 0 1000 1125" font-family="Noto Sans CJK SC, sans-serif"><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto" markerUnits="strokeWidth"><path d="M0 0 L7 3.5 L0 7 Z" fill="#8296ad"/></marker></defs><rect width="100%" height="100%" fill="white"/><rect x="50" y="24" width="900" height="123" rx="14" fill="#ffffff" stroke="#3979c9" stroke-width="2.5"/><text x="500.0" y="73.63" font-size="34" font-weight="650" text-anchor="middle" fill="#3979c9">早期货币与商业信用</text><text x="500.0" y="121.41000000000001" font-size="28" font-weight="400" text-anchor="middle" fill="#203247">商品交换、金属货币、借贷、商业票据等逐渐发展。</text><line x1="500.0" y1="147" x2="500.0" y2="177" stroke="#8296ad" stroke-width="3" marker-end="url(#arrow)"/><rect x="50" y="182" width="900" height="123" rx="14" fill="#ffffff" stroke="#16877b" stroke-width="2.5"/><text x="500.0" y="231.63" font-size="34" font-weight="650" text-anchor="middle" fill="#16877b">现代银行制度的形成</text><text x="500.0" y="279.40999999999997" font-size="28" font-weight="400" text-anchor="middle" fill="#203247">银行存款、贷款、跨地区结算及公共货币制度不断发展。</text><line x1="500.0" y1="305" x2="500.0" y2="335" stroke="#8296ad" stroke-width="3" marker-end="url(#arrow)"/><rect x="50" y="340" width="900" height="123" rx="14" fill="#ffffff" stroke="#a48342" stroke-width="2.5"/><text x="500.0" y="389.63" font-size="34" font-weight="650" text-anchor="middle" fill="#a48342">证券市场的形成</text><text x="500.0" y="437.41" font-size="28" font-weight="400" text-anchor="middle" fill="#203247">股份公司、政府债券和有组织的证券交易市场逐渐发展。</text><line x1="500.0" y1="463" x2="500.0" y2="493" stroke="#8296ad" stroke-width="3" marker-end="url(#arrow)"/><rect x="50" y="498" width="900" height="123" rx="14" fill="#ffffff" stroke="#8870ae" stroke-width="2.5"/><text x="500.0" y="547.63" font-size="34" font-weight="650" text-anchor="middle" fill="#8870ae">现代中央银行与金融监管</text><text x="500.0" y="595.4100000000001" font-size="28" font-weight="400" text-anchor="middle" fill="#203247">建立货币管理、最后贷款人、存款保障及其他金融监管制度。</text><line x1="500.0" y1="621" x2="500.0" y2="651" stroke="#8296ad" stroke-width="3" marker-end="url(#arrow)"/><rect x="50" y="656" width="900" height="123" rx="14" fill="#ffffff" stroke="#3979c9" stroke-width="2.5"/><text x="500.0" y="705.63" font-size="34" font-weight="650" text-anchor="middle" fill="#3979c9">国际金融体系的发展</text><text x="500.0" y="753.4100000000001" font-size="28" font-weight="400" text-anchor="middle" fill="#203247">金本位、布雷顿森林体系及现代跨境金融市场不断演变。</text><line x1="500.0" y1="779" x2="500.0" y2="809" stroke="#8296ad" stroke-width="3" marker-end="url(#arrow)"/><rect x="50" y="814" width="900" height="123" rx="14" fill="#ffffff" stroke="#16877b" stroke-width="2.5"/><text x="500.0" y="863.63" font-size="34" font-weight="650" text-anchor="middle" fill="#16877b">现代金融理论与金融创新</text><text x="500.0" y="911.4100000000001" font-size="28" font-weight="400" text-anchor="middle" fill="#203247">投资组合理论、资产定价、衍生品及金融工程迅速发展。</text><line x1="500.0" y1="937" x2="500.0" y2="967" stroke="#8296ad" stroke-width="3" marker-end="url(#arrow)"/><rect x="50" y="972" width="900" height="123" rx="14" fill="#ffffff" stroke="#a48342" stroke-width="2.5"/><text x="500.0" y="1021.63" font-size="34" font-weight="650" text-anchor="middle" fill="#a48342">数字金融时代</text><text x="500.0" y="1069.41" font-size="28" font-weight="400" text-anchor="middle" fill="#203247">电子交易、互联网金融、人工智能及分布式账本等技术进入金融领域。</text></svg>