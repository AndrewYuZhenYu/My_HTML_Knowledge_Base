   <g id="text_6">
    <text style="font-size: 12.3px; font-family: 'Noto Sans CJK JP'; fill: #263746" transform="translate(54.6768 242.998697)">价格在相对稳定区间反复变化</text>
    <text style="font-size: 12.3px; font-family: 'Noto Sans CJK JP'; fill: #263746" transform="translate(54.6768 258.053705)">研究区间交易、均值回归及突破条件</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 15px; font-family: 'Noto Sans CJK JP'; text-anchor: start; fill: #19354d" x="382.2768" y="211.264986" transform="rotate(-0 382.2768 211.264986)">高波动不确定市场</text>
