    <text style="font-weight: 700; font-size: 15px; font-family: 'Noto Sans CJK JP'; text-anchor: start; fill: #19354d" x="54.6768" y="85.804986" transform="rotate(-0 54.6768 85.804986)">明确上涨趋势</text>
   </g>
   <g id="text_2">
    <text style="font-size: 12.3px; font-family: 'Noto Sans CJK JP'; fill: #263746" transform="translate(54.6768 117.538697)">更高高点、更高低点、中期趋势向上</text>
    <text style="font-size: 12.3px; font-family: 'Noto Sans CJK JP'; fill: #263746" transform="translate(54.6768 132.593705)">研究趋势跟踪、突破、上涨回调策略</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 15px; font-family: 'Noto Sans CJK JP'; text-anchor: start; fill: #19354d" x="382.2768" y="85.804986" transform="rotate(-0 382.2768 85.804986)">明确下跌趋势</text>
   </g>
   <g id="text_4">
    <text style="font-size: 12.3px; font-family: 'Noto Sans CJK JP'; fill: #263746" transform="translate(382.2768 117.538697)">更低高点、更低低点、中期趋势向下</text>
    <text style="font-size: 12.3px; font-family: 'Noto Sans CJK JP'; fill: #263746" transform="translate(382.2768 132.593705)">研究风险降低、观望、潜在反转条件</text>
