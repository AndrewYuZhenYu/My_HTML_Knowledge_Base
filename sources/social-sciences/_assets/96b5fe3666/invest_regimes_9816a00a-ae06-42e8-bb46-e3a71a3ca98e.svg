   <g id="text_5">
    <text style="font-weight: 700; font-size: 15px; font-family: 'Noto Sans CJK JP'; text-anchor: start; fill: #19354d" x="54.6768" y="211.264986" transform="rotate(-0 54.6768 211.264986)">横盘震荡市场</text>
