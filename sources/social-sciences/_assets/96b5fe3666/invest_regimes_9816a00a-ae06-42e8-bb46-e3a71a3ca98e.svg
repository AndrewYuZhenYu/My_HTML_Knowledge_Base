   <g id="text_8">
    <text style="font-size: 12.3px; font-family: 'Noto Sans CJK JP'; fill: #263746" transform="translate(382.2768 242.998697)">价格剧烈变化、趋势频繁改变</text>
    <text style="font-size: 12.3px; font-family: 'Noto Sans CJK JP'; fill: #263746" transform="translate(382.2768 258.053705)">重点研究风险预算、流动性及策略适用性</text>
