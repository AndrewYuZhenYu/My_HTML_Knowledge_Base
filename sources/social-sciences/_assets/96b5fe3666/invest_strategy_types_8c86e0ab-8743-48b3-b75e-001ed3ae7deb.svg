    <text style="font-weight: 700; font-size: 15px; font-family: 'Noto Sans CJK JP'; text-anchor: start; fill: #19354d" x="54.6768" y="94.966698" transform="rotate(-0 54.6768 94.966698)">价值与成长型策略</text>
   </g>
   <g id="text_2">
    <text style="font-size: 12.3px; font-family: 'Noto Sans CJK JP'; fill: #263746" transform="translate(54.6768 122.449529)">研究企业经济价值</text>
