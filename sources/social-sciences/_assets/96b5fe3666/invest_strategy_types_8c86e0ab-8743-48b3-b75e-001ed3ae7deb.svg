   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 15px; font-family: 'Noto Sans CJK JP'; text-anchor: start; fill: #19354d" x="54.6768" y="207.142698" transform="rotate(-0 54.6768 207.142698)">回归与反转型策略</text>
   </g>
   <g id="text_6">
    <text style="font-size: 12.3px; font-family: 'Noto Sans CJK JP'; fill: #263746" transform="translate(54.6768 234.625529)">研究价格偏离后的恢复或方向改变</text>
