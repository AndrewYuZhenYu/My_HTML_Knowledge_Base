   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 15px; font-family: 'Noto Sans CJK JP'; text-anchor: start; fill: #19354d" x="382.2768" y="207.142698" transform="rotate(-0 382.2768 207.142698)">事件驱动型策略</text>
