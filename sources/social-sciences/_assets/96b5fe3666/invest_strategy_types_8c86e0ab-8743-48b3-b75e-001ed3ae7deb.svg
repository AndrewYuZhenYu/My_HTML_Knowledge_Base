   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 15px; font-family: 'Noto Sans CJK JP'; text-anchor: start; fill: #19354d" x="382.2768" y="94.966698" transform="rotate(-0 382.2768 94.966698)">趋势与动量型策略</text>
   </g>
   <g id="text_4">
    <text style="font-size: 12.3px; font-family: 'Noto Sans CJK JP'; fill: #263746" transform="translate(382.2768 122.449529)">研究价格变化的持续性</text>
