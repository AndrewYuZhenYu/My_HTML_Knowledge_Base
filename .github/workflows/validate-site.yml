name: Validate static site

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: python -m pip install -r requirements.txt
      - run: npm ci
      - run: python tools/build.py --check
      - run: python tests/smoke.py
      - run: python tests/test_site_integrity.py
      - run: python tools/check_site_integrity.py --require-tracked
      - name: Ensure generated pages were committed
        run: git diff --exit-code -- index.html subjects assets/search-data.js assets/imported docs/conversion-report.json
